# Test profile: the datasource points at the Testcontainers MySQL (AbstractIntegrationTest).
rutera.log.dir=target/logs
rutera.bootstrap.firma-name=Test Transport
rutera.bootstrap.firma-country=PL
rutera.bootstrap.language=pl
rutera.bootstrap.admin-login=owner@test.local
rutera.bootstrap.admin-password=Owner-Pass-1234
rutera.bootstrap.admin-name=Anna Kowalska
# Cheap hashes keep the login tests fast; production default is 12.
rutera.security.bcrypt-strength=4
rutera.security.lockout-max-attempts=5
rutera.security.lockout-duration=15m
logging.level.com.rutera=INFO
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
