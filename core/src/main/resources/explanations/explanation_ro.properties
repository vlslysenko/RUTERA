explanation.infringement.DAILY_DRIVING_EXCEEDED=La data de {{inf.date}}, perioada zilnică de conducere a fost de {{inf.recorded}}; limita este de {{inf.limit}} (depășire cu {{inf.excess}}). Art. 6 alin. (1) din Regulamentul (CE) nr. 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=În săptămâna {{inf.period}}, perioada zilnică de conducere a fost prelungită la 10 ore de mai mult de două ori ({{inf.recorded}}). Art. 6 alin. (1) din Regulamentul (CE) nr. 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=În săptămâna {{inf.period}}, perioada săptămânală de conducere a fost de {{inf.recorded}}; limita este de 56 h (depășire cu {{inf.excess}}). Art. 6 alin. (2) din Regulamentul (CE) nr. 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=În cele două săptămâni consecutive {{inf.period}}, perioada totală de conducere a fost de {{inf.recorded}}; limita este de 90 h (depășire cu {{inf.excess}}). Art. 6 alin. (3) din Regulamentul (CE) nr. 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=La data de {{inf.date}} ({{inf.period}}), vehiculul a fost condus {{inf.recorded}} fără pauza obligatorie de cel puțin 45 de minute; limita este de 4 h 30 min (depășire cu {{inf.excess}}). Art. 7 din Regulamentul (CE) nr. 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=La data de {{inf.date}}, perioada de repaus zilnic a fost de {{inf.recorded}}; minimul obligatoriu este de {{inf.limit}} (reducere cu {{inf.excess}}). Art. 8 din Regulamentul (CE) nr. 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Perioada de repaus săptămânal în intervalul {{inf.period}} a fost de {{inf.recorded}}; minimul obligatoriu este de {{inf.limit}} (reducere cu {{inf.excess}}). Art. 8 alin. (6) din Regulamentul (CE) nr. 561/2006.
explanation.infringement.WEEKLY_REST_LATE=Perioada de repaus săptămânal nu a început cel târziu la sfârșitul a șase perioade de 24 de ore de la sfârșitul repausului săptămânal anterior (perioada {{inf.period}}, întârziere {{inf.excess}}). Art. 8 alin. (6) din Regulamentul (CE) nr. 561/2006.
explanation.infringement.REST_INTERRUPTED=La data de {{inf.date}}, pauza sau perioada de repaus a fost întreruptă ({{inf.period}}, {{inf.recorded}}). Art. 7-9 din Regulamentul (CE) nr. 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=La data de {{inf.date}}, timpul de muncă a fost de {{inf.recorded}}, iar pauza de lucru a fost mai scurtă decât cea obligatorie ({{inf.limit}}; lipsă {{inf.excess}}). Art. 5 din Directiva 2002/15/CE, HG nr. 38/2008.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=La data de {{inf.date}}, cu muncă de noapte prestată, timpul de muncă a fost de {{inf.recorded}}; limita este de 10 h (depășire cu {{inf.excess}}). Art. 7 din Directiva 2002/15/CE, HG nr. 38/2008.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=În săptămâna {{inf.period}}, timpul de muncă a fost de {{inf.recorded}}; limita este de {{inf.limit}} (depășire cu {{inf.excess}}). Art. 4 din Directiva 2002/15/CE, HG nr. 38/2008.
explanation.infringement.MISSING_MANUAL_ENTRY=Pentru perioada {{inf.period}} ({{inf.recorded}}) lipsesc înregistrările activităților; nu s-a efectuat o introducere manuală. Art. 34 alin. (3) din Regulamentul (UE) nr. 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=La data de {{inf.date}} nu a fost introdus simbolul țării (începutul sau sfârșitul perioadei zilnice de lucru ori trecerea frontierei): {{inf.recorded}}. Art. 34 alin. (7) din Regulamentul (UE) nr. 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=La data de {{inf.date}} ({{inf.period}}), vehiculul {{vehicle.plate}} a fost condus fără cardul de conducător auto introdus ({{inf.recorded}}). Art. 34 alin. (1) din Regulamentul (UE) nr. 165/2014.
explanation.infringement.SPEEDING_EVENT=La data de {{inf.date}}, tahograful a înregistrat un eveniment de depășire a vitezei ({{inf.recorded}}, perioada {{inf.period}}).
explanation.infringement.OTHER=La data de {{inf.date}} s-a constatat următoarea neregulă: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=ambuteiaj neprevăzut după un accident
explanation.reason.TRAFFIC_ACCIDENT.text=Cauza a fost un ambuteiaj neprevăzut provocat de un accident rutier, care nu putea fi anticipat la planificarea cursei.
explanation.reason.ROAD_CLOSURE_DETOUR.short=închiderea bruscă a drumului / ocolire
explanation.reason.ROAD_CLOSURE_DETOUR.text=Cauza a fost închiderea bruscă a drumului și o rută ocolitoare impusă, necunoscute înainte de începerea cursei.
explanation.reason.EXTREME_WEATHER.short=condiții meteo extreme apărute brusc
explanation.reason.EXTREME_WEATHER.text=Cauza a fost o înrăutățire bruscă și gravă a condițiilor meteorologice și de drum (de exemplu viscol, polei, furtună), care nu a permis oprirea în siguranță sau continuarea cursei conform planului.
explanation.reason.NO_PARKING_SPACE.short=niciun loc liber în parcare
explanation.reason.NO_PARKING_SPACE.text=La locul de oprire planificat și în parcările verificate ulterior nu a existat niciun loc liber potrivit pentru vehicul; deplasarea a continuat doar până la cel mai apropiat loc de oprire corespunzător.
explanation.reason.SECURITY_THREAT.short=pericol pentru conducătorul auto, vehicul sau încărcătură
explanation.reason.SECURITY_THREAT.text=Oprirea în locul în care s-a atins limita ar fi pus în pericol siguranța conducătorului auto, a vehiculului sau a încărcăturii (de exemplu risc de furt sau atac, acostament periculos).
explanation.reason.VEHICLE_BREAKDOWN.short=defecțiunea vehiculului
explanation.reason.VEHICLE_BREAKDOWN.text=Din cauza unei defecțiuni a vehiculului a fost necesară deplasarea până la un loc sigur sau la un service.
explanation.reason.LOAD_SAFETY.short=siguranța încărcăturii
explanation.reason.LOAD_SAFETY.text=A fost necesară asigurarea încărcăturii (de exemplu încărcătură deplasată, defectarea agregatului frigorific, mărfuri periculoase) și deplasarea până la un loc unde acest lucru se putea face în siguranță.
explanation.reason.MEDICAL_EMERGENCY.short=urgență medicală / acordarea primului ajutor
explanation.reason.MEDICAL_EMERGENCY.text=Cauza a fost o urgență medicală sau necesitatea de a acorda primul ajutor unei alte persoane.
explanation.reason.AUTHORITY_ORDER.short=dispoziția poliției / autorității / personalului terminalului
explanation.reason.AUTHORITY_ORDER.text=Pauza sau repausul au fost întrerupte la dispoziția poliției, a altei autorități sau a personalului autorizat al terminalului, pentru mutarea vehiculului (Nota de orientare nr. 3 a Comisiei).
explanation.reason.FERRY_TRAIN_DELAY.short=întârzierea feribotului sau a trenului
explanation.reason.FERRY_TRAIN_DELAY.text=Cauza a fost întârzierea sau modificarea orei de plecare ori de sosire a feribotului sau a trenului utilizat.
explanation.reason.REACH_HOME_OR_BASE.short=ajungerea la centrul operațional sau la domiciliu pentru repausul săptămânal
explanation.reason.REACH_HOME_OR_BASE.text=În circumstanțe excepționale, perioada de conducere a fost depășită pentru a ajunge la centrul operațional al angajatorului sau la locul de reședință al conducătorului auto, în vederea efectuării repausului săptămânal.
explanation.reason.LOADING_DELAY.short=încărcare / descărcare prelungită
explanation.reason.LOADING_DELAY.text=Cauza a fost încărcarea, descărcarea sau așteptarea prelungită la client.
explanation.reason.DISPATCH_INSTRUCTION.short=instrucțiunea dispecerului sau a clientului
explanation.reason.DISPATCH_INSTRUCTION.text=Deplasarea a continuat la instrucțiunea dispecerului sau a clientului.
explanation.reason.OWN_PLANNING_ERROR.short=estimare greșită proprie a timpului sau a traseului
explanation.reason.OWN_PLANNING_ERROR.text=Cauza a fost o estimare greșită proprie a timpului de conducere rămas sau a traseului.
explanation.reason.RECORDING_ERROR.short=eroare de utilizare a tahografului
explanation.reason.RECORDING_ERROR.text=Cauza a fost o eroare de utilizare a tahografului (de exemplu activitate greșit selectată, introducere manuală sau simbol de țară omise); activitățile efectiv desfășurate sunt descrise mai jos.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=defecțiunea cardului sau a tahografului
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Cauza a fost defecțiunea cardului de conducător auto sau a tahografului; activitățile au fost înregistrate pe imprimate conform art. 35 și 37 din Regulamentul (UE) nr. 165/2014.
explanation.reason.DATA_DISPUTE.short=contest constatarea
explanation.reason.DATA_DISPUTE.text=Nu sunt de acord că s-a produs o încălcare, din motivele arătate mai jos.
explanation.reason.OTHER.short=alt motiv
explanation.reason.OTHER.text=Motivul este descris mai jos.
explanation.art12.claimSafety=Invoc art. 12 primul paragraf din Regulamentul (CE) nr. 561/2006. Derogarea a fost necesară pentru a garanta siguranța persoanelor, a vehiculului sau a încărcăturii și pentru a ajunge la un loc de oprire corespunzător ({{art12.stopPlace}}); siguranța rutieră nu a fost pusă în pericol.
explanation.art12.claimHome1h=Invoc art. 12 al doilea paragraf din Regulamentul (CE) nr. 561/2006: în circumstanțe excepționale, perioada zilnică sau săptămânală de conducere a fost depășită cu {{inf.excess}} (cel mult 1 oră) pentru a ajunge la {{art12.destination}} în vederea efectuării repausului săptămânal.
explanation.art12.claimHome2h=Invoc art. 12 al treilea paragraf din Regulamentul (CE) nr. 561/2006: în circumstanțe excepționale, perioada zilnică sau săptămânală de conducere a fost depășită cu {{inf.excess}} (cel mult 2 ore) pentru a ajunge la {{art12.destination}} în vederea efectuării repausului săptămânal normal; imediat înainte de conducerea suplimentară s-a efectuat o pauză neîntreruptă de 30 de minute ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Iau la cunoștință că prelungirea trebuie compensată printr-o perioadă echivalentă de repaus, luată integral împreună cu orice perioadă de repaus, până la sfârșitul celei de-a treia săptămâni care urmează săptămânii în cauză.
explanation.art12.noteMade=Natura și motivul derogării au fost menționate manual pe imprimatul tahografului (sau pe foaia de înregistrare) la data de {{art12.noteDate}}, ora {{art12.noteTime}}, cel târziu la sosirea în locul de oprire. Copia sau fotografia este anexată.
explanation.art12.noteNotMade=La momentul evenimentului nu a fost făcută o mențiune manuală privind derogarea pe imprimatul tahografului.
explanation.art12.notClaimed=Nu invoc art. 12 din Regulamentul (CE) nr. 561/2006.
explanation.declaration.truth=Declar că prezenta notă explicativă este conformă cu realitatea și o dau de bunăvoie. Am luat cunoștință de datele tahografului pe baza cărora a fost constatată încălcarea.
explanation.declaration.dispute=Nu sunt de acord cu constatarea din următorul motiv: {{dispute.text}}
explanation.employer.received=Notă explicativă primită la data de {{employer.date}} de: {{employer.signatory}}.
explanation.employer.assessJustified=Evaluare: derogarea este justificată (circumstanțe excepționale, imprevizibile).
explanation.employer.assessNotJustified=Evaluare: nota explicativă nu justifică încălcarea.
explanation.employer.assessPending=Evaluare: sunt necesare clarificări suplimentare.
explanation.employer.instructed=Conducătorul auto a fost instruit cu privire la normele privind perioadele de conducere, pauzele și perioadele de repaus (art. 6-9 din Regulamentul (CE) nr. 561/2006) și la obligația de a menționa manual natura și motivul derogării pe imprimatul tahografului cel târziu la sosirea într-un loc de oprire corespunzător.
explanation.employer.actions=Măsuri luate: {{employer.actions}}
explanation.employer.refusal=Conducătorul auto a refuzat la data de {{refusal.date}} să dea notă explicativă / să semneze. Martor: {{refusal.witness}}.
