explanation.infringement.DAILY_DRIVING_EXCEEDED=Dne {{inf.date}} činila denní doba řízení {{inf.recorded}}; limit je {{inf.limit}} (překročení o {{inf.excess}}). Čl. 6 odst. 1 nařízení (ES) č. 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=V týdnu {{inf.period}} byla denní doba řízení prodloužena na 10 hodin více než dvakrát ({{inf.recorded}}). Čl. 6 odst. 1 nařízení (ES) č. 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=V týdnu {{inf.period}} činila týdenní doba řízení {{inf.recorded}}; limit je 56 h (překročení o {{inf.excess}}). Čl. 6 odst. 2 nařízení (ES) č. 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=Ve dvou po sobě jdoucích týdnech {{inf.period}} činila celková doba řízení {{inf.recorded}}; limit je 90 h (překročení o {{inf.excess}}). Čl. 6 odst. 3 nařízení (ES) č. 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=Dne {{inf.date}} ({{inf.period}}) bylo vozidlo řízeno {{inf.recorded}} bez předepsané přestávky v délce nejméně 45 minut; limit je 4 h 30 min (překročení o {{inf.excess}}). Čl. 7 nařízení (ES) č. 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=Dne {{inf.date}} činila denní doba odpočinku {{inf.recorded}}; požadované minimum je {{inf.limit}} (zkrácení o {{inf.excess}}). Čl. 8 nařízení (ES) č. 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Týdenní doba odpočinku v období {{inf.period}} činila {{inf.recorded}}; požadované minimum je {{inf.limit}} (zkrácení o {{inf.excess}}). Čl. 8 odst. 6 nařízení (ES) č. 561/2006.
explanation.infringement.WEEKLY_REST_LATE=Týdenní doba odpočinku nezačala nejpozději po šesti 24hodinových obdobích od konce předchozí týdenní doby odpočinku (období {{inf.period}}, zpoždění {{inf.excess}}). Čl. 8 odst. 6 nařízení (ES) č. 561/2006.
explanation.infringement.REST_INTERRUPTED=Dne {{inf.date}} byla přestávka nebo doba odpočinku přerušena ({{inf.period}}, {{inf.recorded}}). Čl. 7 až 9 nařízení (ES) č. 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=Dne {{inf.date}} činila pracovní doba {{inf.recorded}} a přestávka v práci byla kratší, než je předepsáno ({{inf.limit}}; chybí {{inf.excess}}). Čl. 5 směrnice 2002/15/ES ve vnitrostátní úpravě.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=Dne {{inf.date}} při výkonu noční práce činila pracovní doba {{inf.recorded}}; limit je 10 h (překročení o {{inf.excess}}). Čl. 7 směrnice 2002/15/ES ve vnitrostátní úpravě.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=V týdnu {{inf.period}} činila pracovní doba {{inf.recorded}}; limit je {{inf.limit}} (překročení o {{inf.excess}}). Čl. 4 směrnice 2002/15/ES ve vnitrostátní úpravě.
explanation.infringement.MISSING_MANUAL_ENTRY=Za období {{inf.period}} ({{inf.recorded}}) chybí záznam činností; ruční záznam nebyl proveden. Čl. 34 odst. 3 nařízení (EU) č. 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=Dne {{inf.date}} nebyl zadán symbol země (začátek nebo konec denní pracovní doby nebo přechod hranice): {{inf.recorded}}. Čl. 34 odst. 7 nařízení (EU) č. 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=Dne {{inf.date}} ({{inf.period}}) bylo vozidlo {{vehicle.plate}} řízeno bez vložené karty řidiče ({{inf.recorded}}). Čl. 34 odst. 1 nařízení (EU) č. 165/2014.
explanation.infringement.SPEEDING_EVENT=Dne {{inf.date}} tachograf zaznamenal událost překročení rychlosti ({{inf.recorded}}, období {{inf.period}}).
explanation.infringement.OTHER=Dne {{inf.date}} byla zjištěna tato nesrovnalost: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=nepředvídatelná kolona po nehodě
explanation.reason.TRAFFIC_ACCIDENT.text=Příčinou byla nepředvídatelná dopravní kolona způsobená dopravní nehodou, kterou nebylo možné předvídat při plánování jízdy.
explanation.reason.ROAD_CLOSURE_DETOUR.short=náhlá uzavírka / objížďka
explanation.reason.ROAD_CLOSURE_DETOUR.text=Příčinou byla náhlá uzavírka silnice a nařízená objížďka, o kterých nebylo před začátkem jízdy známo.
explanation.reason.EXTREME_WEATHER.short=náhlé extrémní počasí
explanation.reason.EXTREME_WEATHER.text=Příčinou bylo náhlé výrazné zhoršení povětrnostních a silničních podmínek (např. sněhová bouře, náledí, vichřice), které neumožnilo bezpečně zastavit nebo pokračovat podle plánu.
explanation.reason.NO_PARKING_SPACE.short=žádné volné parkovací místo
explanation.reason.NO_PARKING_SPACE.text=Na plánovaném místě zastavení ani na dalších vyzkoušených parkovištích nebylo volné místo vhodné pro vozidlo; jízda pokračovala pouze k nejbližšímu vhodnému místu zastavení.
explanation.reason.SECURITY_THREAT.short=ohrožení řidiče, vozidla nebo nákladu
explanation.reason.SECURITY_THREAT.text=Zastavení v místě, kde byl limit dosažen, by ohrozilo bezpečnost řidiče, vozidla nebo nákladu (např. riziko krádeže nebo přepadení, nebezpečná krajnice).
explanation.reason.VEHICLE_BREAKDOWN.short=porucha vozidla
explanation.reason.VEHICLE_BREAKDOWN.text=Kvůli poruše vozidla bylo nutné dojet na bezpečné místo nebo do servisu.
explanation.reason.LOAD_SAFETY.short=zajištění nákladu
explanation.reason.LOAD_SAFETY.text=Bylo nutné zajistit náklad (např. posunutý náklad, porucha chladicího agregátu, nebezpečné věci) a dojet na místo, kde to bylo možné provést bezpečně.
explanation.reason.MEDICAL_EMERGENCY.short=zdravotní obtíže / poskytnutí první pomoci
explanation.reason.MEDICAL_EMERGENCY.text=Příčinou byla náhlá zdravotní situace nebo nutnost poskytnout první pomoc jiné osobě.
explanation.reason.AUTHORITY_ORDER.short=pokyn policie / úřadu / obsluhy terminálu
explanation.reason.AUTHORITY_ORDER.text=Přestávka nebo doba odpočinku byla přerušena na pokyn policie, jiného orgánu nebo oprávněné obsluhy terminálu za účelem přeparkování vozidla (pokyn Komise č. 3).
explanation.reason.FERRY_TRAIN_DELAY.short=zpoždění trajektu nebo vlaku
explanation.reason.FERRY_TRAIN_DELAY.text=Příčinou bylo zpoždění nebo změna času odjezdu či příjezdu použitého trajektu nebo vlaku.
explanation.reason.REACH_HOME_OR_BASE.short=dojezd do provozního střediska nebo bydliště na týdenní odpočinek
explanation.reason.REACH_HOME_OR_BASE.text=Za výjimečných okolností byla doba řízení překročena, aby řidič dojel do provozního střediska zaměstnavatele nebo do místa svého bydliště a čerpal tam týdenní dobu odpočinku.
explanation.reason.LOADING_DELAY.short=prodloužená nakládka / vykládka
explanation.reason.LOADING_DELAY.text=Příčinou byla prodloužená nakládka, vykládka nebo čekání u zákazníka.
explanation.reason.DISPATCH_INSTRUCTION.short=pokyn dispečera nebo zákazníka
explanation.reason.DISPATCH_INSTRUCTION.text=V jízdě se pokračovalo na pokyn dispečera nebo zákazníka.
explanation.reason.OWN_PLANNING_ERROR.short=vlastní chybný odhad času nebo trasy
explanation.reason.OWN_PLANNING_ERROR.text=Příčinou byl vlastní chybný odhad zbývající doby řízení nebo trasy.
explanation.reason.RECORDING_ERROR.short=chyba při obsluze tachografu
explanation.reason.RECORDING_ERROR.text=Příčinou byla chyba při obsluze tachografu (např. zvolena nesprávná činnost, opomenut ruční záznam nebo symbol země); skutečně vykonávané činnosti jsou popsány níže.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=porucha karty řidiče nebo tachografu
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Příčinou byla porucha karty řidiče nebo tachografu; činnosti byly zaznamenány na výtiscích podle čl. 35 a 37 nařízení (EU) č. 165/2014.
explanation.reason.DATA_DISPUTE.short=zjištění rozporuji
explanation.reason.DATA_DISPUTE.text=Nesouhlasím s tím, že došlo k porušení, z důvodů uvedených níže.
explanation.reason.OTHER.short=jiný důvod
explanation.reason.OTHER.text=Důvod je popsán níže.
explanation.art12.claimSafety=Odvolávám se na čl. 12 první pododstavec nařízení (ES) č. 561/2006. Odchýlení bylo nezbytné k zajištění bezpečnosti osob, vozidla nebo nákladu a k dosažení vhodného místa zastavení ({{art12.stopPlace}}); bezpečnost silničního provozu tím nebyla ohrožena.
explanation.art12.claimHome1h=Odvolávám se na čl. 12 druhý pododstavec nařízení (ES) č. 561/2006: za výjimečných okolností byla denní nebo týdenní doba řízení překročena o {{inf.excess}} (nejvýše 1 hodinu), aby bylo dosaženo {{art12.destination}} za účelem čerpání týdenní doby odpočinku.
explanation.art12.claimHome2h=Odvolávám se na čl. 12 třetí pododstavec nařízení (ES) č. 561/2006: za výjimečných okolností byla denní nebo týdenní doba řízení překročena o {{inf.excess}} (nejvýše 2 hodiny), aby bylo dosaženo {{art12.destination}} za účelem čerpání běžné týdenní doby odpočinku; bezprostředně před dodatečnou dobou řízení byla vybrána nepřerušená přestávka v délce 30 minut ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Beru na vědomí, že prodloužení musí být vyrovnáno rovnocennou dobou odpočinku vybranou vcelku spolu s jakoukoli dobou odpočinku do konce třetího týdne následujícího po dotčeném týdnu.
explanation.art12.noteMade=Druh a důvod odchýlení byly ručně uvedeny na výtisku z tachografu (nebo na záznamovém listu) dne {{art12.noteDate}} v {{art12.noteTime}}, nejpozději po příjezdu na místo zastavení. Kopie nebo fotografie je přiložena.
explanation.art12.noteNotMade=V době události nebyla na výtisku z tachografu provedena ruční poznámka o odchýlení.
explanation.art12.notClaimed=Neodvolávám se na čl. 12 nařízení (ES) č. 561/2006.
explanation.declaration.truth=Prohlašuji, že toto vysvětlení je pravdivé a podávám je dobrovolně. Byl(a) jsem seznámen(a) s daty z tachografu, na jejichž základě bylo porušení zjištěno.
explanation.declaration.dispute=Se zjištěním nesouhlasím z tohoto důvodu: {{dispute.text}}
explanation.employer.received=Vysvětlení převzal(a) dne {{employer.date}}: {{employer.signatory}}.
explanation.employer.assessJustified=Hodnocení: odchýlení je odůvodněné (výjimečné, nepředvídatelné okolnosti).
explanation.employer.assessNotJustified=Hodnocení: vysvětlení porušení neospravedlňuje.
explanation.employer.assessPending=Hodnocení: je třeba další objasnění.
explanation.employer.instructed=Řidič byl poučen o pravidlech pro dobu řízení, přestávky a doby odpočinku (čl. 6 až 9 nařízení (ES) č. 561/2006) a o povinnosti ručně uvést druh a důvod odchýlení na výtisku z tachografu nejpozději po příjezdu na vhodné místo zastavení.
explanation.employer.actions=Přijatá opatření: {{employer.actions}}
explanation.employer.refusal=Řidič dne {{refusal.date}} odmítl podat vysvětlení / podepsat. Svědek: {{refusal.witness}}.
explanation.signature.driver=Podpis řidiče
explanation.signature.employer=Podpis zaměstnavatele nebo pověřené osoby
explanation.signature.electronic=Podepsáno na obrazovce v aplikaci RUTERA dne {{sign.timestamp}}.
explanation.printout.instruction=Napište tento text ručně na zadní stranu výtisku z tachografu (nebo na záznamový list) nejpozději po příjezdu na místo zastavení a podepište. Výtisk uchovávejte ve vozidle.
explanation.printout.art12Safety={{date}} {{time}} Čl. 12 nař. (ES) 561/2006: {{reasonShort}}, {{location}}. {{infringementShort}} {{excess}} za účelem dojezdu na bezpečné místo zastavení: {{stopPlace}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.art12Home={{date}} {{time}} Čl. 12 pododst. 2/3 nař. (ES) 561/2006: doba řízení překročena o {{excess}} za účelem dojezdu do {{destination}} na týdenní odpočinek. Přestávka 30 min {{breakFrom}}-{{breakTo}}. Důvod: {{reasonShort}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.restInterrupted={{date}} {{time}} Odpočinek přerušen na {{minutes}} min na pokyn {{authority}} za účelem přeparkování vozidla, {{location}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
