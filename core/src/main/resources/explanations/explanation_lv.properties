explanation.infringement.DAILY_DRIVING_EXCEEDED={{inf.date}} ikdienas transportlīdzekļa vadīšanas laiks bija {{inf.recorded}}; atļauts {{inf.limit}} (pārsniegts par {{inf.excess}}). Regulas (EK) Nr. 561/2006 6. panta 1. punkts.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=Nedēļā {{inf.period}} ikdienas vadīšanas laiks vairāk nekā divas reizes tika pagarināts līdz 10 stundām ({{inf.recorded}}). Regulas (EK) Nr. 561/2006 6. panta 1. punkts.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=Nedēļā {{inf.period}} iknedēļas vadīšanas laiks bija {{inf.recorded}}; atļauts 56 st. (pārsniegts par {{inf.excess}}). Regulas (EK) Nr. 561/2006 6. panta 2. punkts.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=Divās secīgās nedēļās {{inf.period}} kopējais vadīšanas laiks bija {{inf.recorded}}; atļauts 90 st. (pārsniegts par {{inf.excess}}). Regulas (EK) Nr. 561/2006 6. panta 3. punkts.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED={{inf.date}} ({{inf.period}}) transportlīdzeklis tika vadīts {{inf.recorded}} bez obligātā vismaz 45 minūšu pārtraukuma; atļauts 4 st. 30 min (pārsniegts par {{inf.excess}}). Regulas (EK) Nr. 561/2006 7. pants.
explanation.infringement.DAILY_REST_INSUFFICIENT={{inf.date}} ikdienas atpūtas laikposms bija {{inf.recorded}}; obligātais minimums {{inf.limit}} (saīsināts par {{inf.excess}}). Regulas (EK) Nr. 561/2006 8. pants.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Iknedēļas atpūtas laikposms laikā {{inf.period}} bija {{inf.recorded}}; obligātais minimums {{inf.limit}} (saīsināts par {{inf.excess}}). Regulas (EK) Nr. 561/2006 8. panta 6. punkts.
explanation.infringement.WEEKLY_REST_LATE=Iknedēļas atpūtas laikposms nesākās vēlākais pēc sešiem 24 stundu laikposmiem kopš iepriekšējā iknedēļas atpūtas laikposma beigām (laikposms {{inf.period}}, kavējums {{inf.excess}}). Regulas (EK) Nr. 561/2006 8. panta 6. punkts.
explanation.infringement.REST_INTERRUPTED={{inf.date}} pārtraukums vai atpūtas laikposms tika pārtraukts ({{inf.period}}, {{inf.recorded}}). Regulas (EK) Nr. 561/2006 7.–9. pants.
explanation.infringement.WORK_BREAK_INSUFFICIENT={{inf.date}} darba laiks bija {{inf.recorded}}, un pārtraukums darbā bija īsāks par noteikto ({{inf.limit}}; iztrūkst {{inf.excess}}). Direktīvas 2002/15/EK 5. pants atbilstoši valsts tiesību aktiem.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED={{inf.date}}, veicot nakts darbu, darba laiks bija {{inf.recorded}}; atļauts 10 st. (pārsniegts par {{inf.excess}}). Direktīvas 2002/15/EK 7. pants atbilstoši valsts tiesību aktiem.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=Nedēļā {{inf.period}} darba laiks bija {{inf.recorded}}; atļauts {{inf.limit}} (pārsniegts par {{inf.excess}}). Direktīvas 2002/15/EK 4. pants atbilstoši valsts tiesību aktiem.
explanation.infringement.MISSING_MANUAL_ENTRY=Par laikposmu {{inf.period}} ({{inf.recorded}}) nav darbību ierakstu; manuāls ieraksts nav veikts. Regulas (ES) Nr. 165/2014 34. panta 3. punkts.
explanation.infringement.MISSING_COUNTRY_SYMBOL={{inf.date}} nav ievadīts valsts simbols (ikdienas darba laikposma sākums vai beigas vai robežas šķērsošana): {{inf.recorded}}. Regulas (ES) Nr. 165/2014 34. panta 7. punkts.
explanation.infringement.DRIVING_WITHOUT_CARD={{inf.date}} ({{inf.period}}) transportlīdzeklis {{vehicle.plate}} tika vadīts bez ievietotas vadītāja kartes ({{inf.recorded}}). Regulas (ES) Nr. 165/2014 34. panta 1. punkts.
explanation.infringement.SPEEDING_EVENT={{inf.date}} tahogrāfs reģistrēja ātruma pārsniegšanas notikumu ({{inf.recorded}}, laikposms {{inf.period}}).
explanation.infringement.OTHER={{inf.date}} konstatēta šāda neatbilstība: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=neparedzēts sastrēgums pēc avārijas
explanation.reason.TRAFFIC_ACCIDENT.text=Iemesls bija neparedzēts satiksmes sastrēgums ceļu satiksmes negadījuma dēļ, ko nevarēja paredzēt, plānojot braucienu.
explanation.reason.ROAD_CLOSURE_DETOUR.short=pēkšņa ceļa slēgšana / apbraucamais ceļš
explanation.reason.ROAD_CLOSURE_DETOUR.text=Iemesls bija pēkšņa ceļa slēgšana un noteikts apbraucamais ceļš, par ko pirms brauciena sākuma nebija zināms.
explanation.reason.EXTREME_WEATHER.short=pēkšņi ekstremāli laikapstākļi
explanation.reason.EXTREME_WEATHER.text=Iemesls bija pēkšņa un būtiska laikapstākļu un ceļa apstākļu pasliktināšanās (piemēram, sniegputenis, apledojums, vētra), kuras dēļ nebija iespējams droši apstāties vai turpināt braucienu pēc plāna.
explanation.reason.NO_PARKING_SPACE.short=stāvvietā nav brīvu vietu
explanation.reason.NO_PARKING_SPACE.text=Plānotajā apstāšanās vietā un vēlāk pārbaudītajās stāvvietās nebija transportlīdzeklim piemērotas brīvas vietas; brauciens tika turpināts tikai līdz tuvākajai piemērotajai apstāšanās vietai.
explanation.reason.SECURITY_THREAT.short=apdraudējums vadītājam, transportlīdzeklim vai kravai
explanation.reason.SECURITY_THREAT.text=Apstāšanās vietā, kur beidzās atļautais laiks, būtu apdraudējusi vadītāja, transportlīdzekļa vai kravas drošību (piemēram, zādzības vai uzbrukuma risks, bīstama ceļa nomale).
explanation.reason.VEHICLE_BREAKDOWN.short=transportlīdzekļa bojājums
explanation.reason.VEHICLE_BREAKDOWN.text=Transportlīdzekļa bojājuma dēļ bija jānokļūst drošā vietā vai remonta vietā.
explanation.reason.LOAD_SAFETY.short=kravas drošība
explanation.reason.LOAD_SAFETY.text=Bija jānodrošina krava (piemēram, pārvietojusies krava, saldēšanas iekārtas bojājums, bīstamas kravas) un jānokļūst vietā, kur to varēja izdarīt droši.
explanation.reason.MEDICAL_EMERGENCY.short=veselības problēmas / pirmā palīdzība
explanation.reason.MEDICAL_EMERGENCY.text=Iemesls bija pēkšņa veselības problēma vai nepieciešamība sniegt pirmo palīdzību citai personai.
explanation.reason.AUTHORITY_ORDER.short=policijas / iestādes / termināļa darbinieku rīkojums
explanation.reason.AUTHORITY_ORDER.text=Pārtraukums vai atpūta tika pārtraukta pēc policijas, citas iestādes vai pilnvarota termināļa darbinieka rīkojuma pārvietot transportlīdzekli (Komisijas vadlīnijas Nr. 3).
explanation.reason.FERRY_TRAIN_DELAY.short=prāmja vai vilciena kavēšanās
explanation.reason.FERRY_TRAIN_DELAY.text=Iemesls bija izmantotā prāmja vai vilciena kavēšanās vai atiešanas vai pienākšanas laika maiņa.
explanation.reason.REACH_HOME_OR_BASE.short=nokļūšana darba devēja operatīvajā centrā vai dzīvesvietā iknedēļas atpūtai
explanation.reason.REACH_HOME_OR_BASE.text=Izņēmuma apstākļos vadīšanas laiks tika pārsniegts, lai nokļūtu darba devēja operatīvajā centrā vai autovadītāja dzīvesvietā iknedēļas atpūtas laikposmam.
explanation.reason.LOADING_DELAY.short=ieilgusi iekraušana / izkraušana
explanation.reason.LOADING_DELAY.text=Iemesls bija ieilgusi iekraušana, izkraušana vai gaidīšana pie klienta.
explanation.reason.DISPATCH_INSTRUCTION.short=dispečera vai klienta norādījums
explanation.reason.DISPATCH_INSTRUCTION.text=Brauciens tika turpināts pēc dispečera vai klienta norādījuma.
explanation.reason.OWN_PLANNING_ERROR.short=paša kļūda laika vai maršruta novērtējumā
explanation.reason.OWN_PLANNING_ERROR.text=Iemesls bija autovadītāja kļūda, novērtējot atlikušo vadīšanas laiku vai maršrutu.
explanation.reason.RECORDING_ERROR.short=tahogrāfa lietošanas kļūda
explanation.reason.RECORDING_ERROR.text=Iemesls bija tahogrāfa lietošanas kļūda (piemēram, izvēlēta nepareiza darbība, aizmirsts manuāls ieraksts vai valsts simbols); faktiski veiktās darbības aprakstītas turpmāk.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=vadītāja kartes vai tahogrāfa bojājums
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Iemesls bija vadītāja kartes vai tahogrāfa bojājums; darbības reģistrētas izdrukās saskaņā ar Regulas (ES) Nr. 165/2014 35. un 37. pantu.
explanation.reason.DATA_DISPUTE.short=apstrīdu konstatējumu
explanation.reason.DATA_DISPUTE.text=Nepiekrītu, ka ir noticis pārkāpums, turpmāk norādīto iemeslu dēļ.
explanation.reason.OTHER.short=cits iemesls
explanation.reason.OTHER.text=Iemesls aprakstīts turpmāk.
explanation.art12.claimSafety=Atsaucos uz Regulas (EK) Nr. 561/2006 12. panta pirmo daļu. Atkāpe bija nepieciešama, lai nodrošinātu personu, transportlīdzekļa vai kravas drošību un nokļūtu piemērotā apstāšanās vietā ({{art12.stopPlace}}); tā neapdraudēja ceļu satiksmes drošību.
explanation.art12.claimHome1h=Atsaucos uz Regulas (EK) Nr. 561/2006 12. panta otro daļu: izņēmuma apstākļos ikdienas vai iknedēļas vadīšanas laiks tika pārsniegts par {{inf.excess}} (ne vairāk kā 1 st.), lai nokļūtu {{art12.destination}} iknedēļas atpūtas laikposmam.
explanation.art12.claimHome2h=Atsaucos uz Regulas (EK) Nr. 561/2006 12. panta trešo daļu: izņēmuma apstākļos ikdienas vai iknedēļas vadīšanas laiks tika pārsniegts par {{inf.excess}} (ne vairāk kā 2 st.), lai nokļūtu {{art12.destination}} regulārajam iknedēļas atpūtas laikposmam; tieši pirms papildu vadīšanas tika izmantots nepārtraukts 30 minūšu pārtraukums ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Apzinos, ka pagarinājums jākompensē ar līdzvērtīgu atpūtas laikposmu, kas izmantojams vienā reizē kopā ar jebkuru atpūtas laikposmu līdz trešās nedēļas beigām pēc attiecīgās nedēļas.
explanation.art12.noteMade=Atkāpes veids un iemesls {{art12.noteDate}} plkst. {{art12.noteTime}}, vēlākais ierodoties apstāšanās vietā, ar roku norādīti tahogrāfa izdrukā (vai reģistrācijas lapā). Kopija vai fotoattēls pievienots.
explanation.art12.noteNotMade=Notikuma brīdī tahogrāfa izdrukā netika ar roku izdarīta atzīme par atkāpi.
explanation.art12.notClaimed=Uz Regulas (EK) Nr. 561/2006 12. pantu neatsaucos.
explanation.declaration.truth=Apliecinu, ka šis paskaidrojums ir patiess un sniegts brīvprātīgi. Esmu iepazinies(-usies) ar tahogrāfa datiem, uz kuru pamata konstatēts pārkāpums.
explanation.declaration.dispute=Konstatējumam nepiekrītu šāda iemesla dēļ: {{dispute.text}}
explanation.employer.received=Paskaidrojumu {{employer.date}} pieņēma: {{employer.signatory}}.
explanation.employer.assessJustified=Novērtējums: atkāpe ir pamatota (izņēmuma, neparedzami apstākļi).
explanation.employer.assessNotJustified=Novērtējums: paskaidrojums pārkāpumu neattaisno.
explanation.employer.assessPending=Novērtējums: nepieciešama papildu noskaidrošana.
explanation.employer.instructed=Autovadītājs iepazīstināts ar transportlīdzekļa vadīšanas laika, pārtraukumu un atpūtas laikposmu noteikumiem (Regulas (EK) Nr. 561/2006 6.–9. pants) un ar pienākumu atkāpes veidu un iemeslu ar roku norādīt tahogrāfa izdrukā vēlākais, ierodoties piemērotā apstāšanās vietā.
explanation.employer.actions=Veiktie pasākumi: {{employer.actions}}
explanation.employer.refusal=Autovadītājs {{refusal.date}} atteicās sniegt paskaidrojumu / parakstīties. Liecinieks: {{refusal.witness}}.
explanation.signature.driver=Autovadītāja paraksts
explanation.signature.employer=Darba devēja vai pilnvarotās personas paraksts
explanation.signature.electronic=Parakstīts ekrānā lietotnē RUTERA {{sign.timestamp}}.
explanation.printout.instruction=Uzrakstiet šo tekstu ar roku tahogrāfa izdrukas otrā pusē (vai reģistrācijas lapā) vēlākais, ierodoties apstāšanās vietā, un parakstieties. Izdruku glabājiet transportlīdzeklī.
explanation.printout.art12Safety={{date}} {{time}} Reg. (EK) 561/2006 12. p.: {{reasonShort}}, {{location}}. {{infringementShort}} {{excess}}, lai nokļūtu drošā apstāšanās vietā: {{stopPlace}}. {{driverName}}, karte {{cardNumber}}, {{plate}}.
explanation.printout.art12Home={{date}} {{time}} Reg. (EK) 561/2006 12. p. 2./3. d.: vadīšanas laiks pārsniegts par {{excess}}, lai nokļūtu {{destination}} iknedēļas atpūtai. Pārtraukums 30 min {{breakFrom}}-{{breakTo}}. Iemesls: {{reasonShort}}. {{driverName}}, karte {{cardNumber}}, {{plate}}.
explanation.printout.restInterrupted={{date}} {{time}} Atpūta pārtraukta uz {{minutes}} min pēc {{authority}} rīkojuma pārvietot transportlīdzekli, {{location}}. {{driverName}}, karte {{cardNumber}}, {{plate}}.
explanation.printout.cardFault={{date}} Vadītāja karte Nr. {{cardNumber}} bojāta / nedarbojas / pazaudēta. {{driverName}}, vadītāja apliecība {{licenceNumber}}, {{plate}}. Darbības: {{activities}}.
