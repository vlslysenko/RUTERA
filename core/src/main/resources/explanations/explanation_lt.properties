explanation.reason.TRAFFIC_ACCIDENT.short=nenumatyta spūstis po avarijos
explanation.reason.TRAFFIC_ACCIDENT.text=Priežastis – nenumatyta eismo spūstis dėl eismo įvykio, kurios nebuvo galima numatyti planuojant reisą.
explanation.reason.ROAD_CLOSURE_DETOUR.short=staigus kelio uždarymas / apvažiavimas
explanation.reason.ROAD_CLOSURE_DETOUR.text=Priežastis – staiga uždarytas kelias ir nurodytas apvažiavimas, apie kuriuos prieš pradedant kelionę nebuvo žinoma.
explanation.reason.EXTREME_WEATHER.short=staigios ekstremalios oro sąlygos
explanation.reason.EXTREME_WEATHER.text=Priežastis – staigus ir didelis oro bei kelio sąlygų pablogėjimas (pvz., pūga, plikledis, audra), dėl kurio nebuvo galima saugiai sustoti ar važiuoti pagal planą.
explanation.reason.NO_PARKING_SPACE.short=nėra laisvos vietos stovėjimo aikštelėje
explanation.reason.NO_PARKING_SPACE.text=Planuotoje sustojimo vietoje ir vėliau patikrintose stovėjimo aikštelėse nebuvo transporto priemonei tinkamos laisvos vietos; važiuota tik iki artimiausios tinkamos sustojimo vietos.
explanation.reason.SECURITY_THREAT.short=grėsmė vairuotojui, transporto priemonei ar kroviniui
explanation.reason.SECURITY_THREAT.text=Sustojimas toje vietoje, kur baigėsi leidžiamas laikas, būtų kėlęs grėsmę vairuotojo, transporto priemonės ar krovinio saugumui (pvz., vagystės ar užpuolimo rizika, pavojingas kelkraštis).
explanation.reason.VEHICLE_BREAKDOWN.short=transporto priemonės gedimas
explanation.reason.VEHICLE_BREAKDOWN.text=Dėl transporto priemonės gedimo reikėjo pasiekti saugią vietą arba remonto vietą.
explanation.reason.LOAD_SAFETY.short=krovinio saugumas
explanation.reason.LOAD_SAFETY.text=Reikėjo apsaugoti krovinį (pvz., pasislinkęs krovinys, šaldymo agregato gedimas, pavojingi kroviniai) ir pasiekti vietą, kur tai buvo galima saugiai padaryti.
explanation.reason.MEDICAL_EMERGENCY.short=sveikatos sutrikimas / pirmoji pagalba
explanation.reason.MEDICAL_EMERGENCY.text=Priežastis – staigus sveikatos sutrikimas arba būtinybė suteikti pirmąją pagalbą kitam asmeniui.
explanation.reason.AUTHORITY_ORDER.short=policijos / institucijos / terminalo darbuotojų nurodymas
explanation.reason.AUTHORITY_ORDER.text=Pertrauka arba poilsis buvo nutraukti policijos, kitos institucijos ar įgalioto terminalo darbuotojo nurodymu perstatyti transporto priemonę (Komisijos gairės Nr. 3).
explanation.reason.FERRY_TRAIN_DELAY.short=kelto ar traukinio vėlavimas
explanation.reason.FERRY_TRAIN_DELAY.text=Priežastis – naudoto kelto ar traukinio vėlavimas arba išvykimo ar atvykimo laiko pasikeitimas.
explanation.reason.REACH_HOME_OR_BASE.short=grįžimas į darbdavio veiklos centrą ar namus savaitiniam poilsiui
explanation.reason.REACH_HOME_OR_BASE.text=Išimtinėmis aplinkybėmis vairavimo laikas buvo viršytas, kad būtų pasiektas darbdavio veiklos centras arba vairuotojo gyvenamoji vieta savaitiniam poilsiui.
explanation.reason.LOADING_DELAY.short=užsitęsęs pakrovimas / iškrovimas
explanation.reason.LOADING_DELAY.text=Priežastis – užsitęsęs pakrovimas, iškrovimas ar laukimas pas klientą.
explanation.reason.DISPATCH_INSTRUCTION.short=ekspeditoriaus ar kliento nurodymas
explanation.reason.DISPATCH_INSTRUCTION.text=Važiuota toliau ekspeditoriaus (dispečerio) ar kliento nurodymu.
explanation.reason.OWN_PLANNING_ERROR.short=savo klaida vertinant laiką ar maršrutą
explanation.reason.OWN_PLANNING_ERROR.text=Priežastis – vairuotojo klaida vertinant likusį vairavimo laiką ar maršrutą.
explanation.reason.RECORDING_ERROR.short=tachografo valdymo klaida
explanation.reason.RECORDING_ERROR.text=Priežastis – tachografo valdymo klaida (pvz., pasirinkta netinkama veikla, pamirštas rankinis įrašas ar šalies simbolis); faktiškai atlikta veikla aprašyta toliau.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=vairuotojo kortelės ar tachografo gedimas
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Priežastis – vairuotojo kortelės ar tachografo gedimas; veikla užregistruota spaudiniuose pagal Reglamento (ES) Nr. 165/2014 35 ir 37 straipsnius.
explanation.reason.DATA_DISPUTE.short=nustatytą pažeidimą ginčiju
explanation.reason.DATA_DISPUTE.text=Nesutinku, kad buvo padarytas pažeidimas, dėl toliau nurodytų priežasčių.
explanation.reason.OTHER.short=kita priežastis
explanation.reason.OTHER.text=Priežastis aprašyta toliau.
explanation.art12.claimSafety=Remiuosi Reglamento (EB) Nr. 561/2006 12 straipsnio pirmąja pastraipa. Nukrypimas buvo būtinas asmenų, transporto priemonės ar krovinio saugumui užtikrinti ir tinkamai sustojimo vietai pasiekti ({{art12.stopPlace}}); eismo saugumui tai nekėlė pavojaus.
explanation.art12.claimHome1h=Remiuosi Reglamento (EB) Nr. 561/2006 12 straipsnio antrąja pastraipa: išimtinėmis aplinkybėmis kasdienis ar savaitinis vairavimo laikas buvo viršytas {{inf.excess}} (ne daugiau kaip 1 val.), kad būtų pasiekta {{art12.destination}} savaitiniam poilsiui.
explanation.art12.claimHome2h=Remiuosi Reglamento (EB) Nr. 561/2006 12 straipsnio trečiąja pastraipa: išimtinėmis aplinkybėmis kasdienis ar savaitinis vairavimo laikas buvo viršytas {{inf.excess}} (ne daugiau kaip 2 val.), kad būtų pasiekta {{art12.destination}} įprastiniam savaitiniam poilsiui; tiesiai prieš papildomą vairavimą padaryta nepertraukiama 30 minučių pertrauka ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Žinau, kad pratęsimas turi būti kompensuotas lygiaverčiu poilsio laikotarpiu, kuris kartu su bet kuriuo poilsio laikotarpiu turi būti išnaudotas iki trečiosios savaitės po atitinkamos savaitės pabaigos.
explanation.art12.noteMade=Nukrypimo pobūdis ir priežastis {{art12.noteDate}} {{art12.noteTime}}, ne vėliau kaip atvykus į sustojimo vietą, ranka įrašyti tachografo spaudinyje (arba registracijos lape). Kopija arba nuotrauka pridedama.
explanation.art12.noteNotMade=Įvykio metu tachografo spaudinyje nebuvo ranka įrašyta pastaba apie nukrypimą.
explanation.art12.notClaimed=Reglamento (EB) Nr. 561/2006 12 straipsniu nesiremiu.
explanation.declaration.truth=Patvirtinu, kad šis pasiaiškinimas yra teisingas ir teikiamas savanoriškai. Su tachografo duomenimis, kuriais remiantis nustatytas pažeidimas, esu susipažinęs (-usi).
explanation.declaration.dispute=Su nustatytu pažeidimu nesutinku dėl šios priežasties: {{dispute.text}}
explanation.employer.received=Pasiaiškinimą {{employer.date}} priėmė: {{employer.signatory}}.
explanation.employer.assessJustified=Įvertinimas: nukrypimas pagrįstas (išimtinės, nenumatytos aplinkybės).
explanation.employer.assessNotJustified=Įvertinimas: pasiaiškinimas pažeidimo nepateisina.
explanation.employer.assessPending=Įvertinimas: reikia papildomo išsiaiškinimo.
explanation.employer.instructed=Vairuotojas (-a) supažindintas (-a) su vairavimo laiko, pertraukų ir poilsio laiko taisyklėmis (Reglamento (EB) Nr. 561/2006 6–9 straipsniai) ir su pareiga ranka įrašyti nukrypimo pobūdį ir priežastį tachografo spaudinyje ne vėliau kaip atvykus į tinkamą sustojimo vietą.
explanation.employer.actions=Taikytos priemonės: {{employer.actions}}
explanation.employer.refusal=Vairuotojas (-a) {{refusal.date}} atsisakė pasiaiškinti / pasirašyti. Liudytojas: {{refusal.witness}}.
