explanation.printout.instruction=Šį tekstą ranka užrašykite tachografo spaudinio kitoje pusėje (arba registracijos lape) ne vėliau kaip atvykę į sustojimo vietą ir pasirašykite. Spaudinį laikykite transporto priemonėje.
