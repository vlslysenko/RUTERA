explanation.infringement.DAILY_DRIVING_EXCEEDED={{inf.date}} kasdienis vairavimo laikas buvo {{inf.recorded}}; leidžiama {{inf.limit}} (viršyta {{inf.excess}}). Reglamento (EB) Nr. 561/2006 6 straipsnio 1 dalis.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=Savaitę {{inf.period}} kasdienis vairavimo laikas daugiau kaip du kartus buvo pratęstas iki 10 valandų ({{inf.recorded}}). Reglamento (EB) Nr. 561/2006 6 straipsnio 1 dalis.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=Savaitę {{inf.period}} savaitinis vairavimo laikas buvo {{inf.recorded}}; leidžiama 56 val. (viršyta {{inf.excess}}). Reglamento (EB) Nr. 561/2006 6 straipsnio 2 dalis.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=Per dvi viena po kitos einančias savaites {{inf.period}} bendras vairavimo laikas buvo {{inf.recorded}}; leidžiama 90 val. (viršyta {{inf.excess}}). Reglamento (EB) Nr. 561/2006 6 straipsnio 3 dalis.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED={{inf.date}} ({{inf.period}}) transporto priemonė buvo vairuojama {{inf.recorded}} be privalomos ne trumpesnės kaip 45 minučių pertraukos; leidžiama 4 val. 30 min. (viršyta {{inf.excess}}). Reglamento (EB) Nr. 561/2006 7 straipsnis.
explanation.infringement.DAILY_REST_INSUFFICIENT={{inf.date}} kasdienis poilsio laikas buvo {{inf.recorded}}; privalomas minimumas {{inf.limit}} (sutrumpinta {{inf.excess}}). Reglamento (EB) Nr. 561/2006 8 straipsnis.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Savaitinis poilsio laikas laikotarpiu {{inf.period}} buvo {{inf.recorded}}; privalomas minimumas {{inf.limit}} (sutrumpinta {{inf.excess}}). Reglamento (EB) Nr. 561/2006 8 straipsnio 6 dalis.
explanation.infringement.WEEKLY_REST_LATE=Savaitinis poilsio laikas neprasidėjo ne vėliau kaip po šešių 24 valandų laikotarpių nuo ankstesnio savaitinio poilsio pabaigos (laikotarpis {{inf.period}}, vėlavimas {{inf.excess}}). Reglamento (EB) Nr. 561/2006 8 straipsnio 6 dalis.
explanation.infringement.REST_INTERRUPTED={{inf.date}} pertrauka arba poilsio laikas buvo nutraukti ({{inf.period}}, {{inf.recorded}}). Reglamento (EB) Nr. 561/2006 7–9 straipsniai.
explanation.infringement.WORK_BREAK_INSUFFICIENT={{inf.date}} darbo laikas buvo {{inf.recorded}}, o darbo pertrauka buvo trumpesnė nei privaloma ({{inf.limit}}; trūksta {{inf.excess}}). Direktyvos 2002/15/EB 5 straipsnis pagal nacionalinę teisę.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED={{inf.date}}, dirbant naktį, darbo laikas buvo {{inf.recorded}}; leidžiama 10 val. (viršyta {{inf.excess}}). Direktyvos 2002/15/EB 7 straipsnis pagal nacionalinę teisę.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=Savaitę {{inf.period}} darbo laikas buvo {{inf.recorded}}; leidžiama {{inf.limit}} (viršyta {{inf.excess}}). Direktyvos 2002/15/EB 4 straipsnis pagal nacionalinę teisę.
explanation.infringement.MISSING_MANUAL_ENTRY=Laikotarpiu {{inf.period}} ({{inf.recorded}}) nėra veiklos įrašų; rankinis įrašas nepadarytas. Reglamento (ES) Nr. 165/2014 34 straipsnio 3 dalis.
explanation.infringement.MISSING_COUNTRY_SYMBOL={{inf.date}} neįvestas šalies simbolis (kasdienio darbo laikotarpio pradžia ar pabaiga arba sienos kirtimas): {{inf.recorded}}. Reglamento (ES) Nr. 165/2014 34 straipsnio 7 dalis.
explanation.infringement.DRIVING_WITHOUT_CARD={{inf.date}} ({{inf.period}}) transporto priemonė {{vehicle.plate}} buvo vairuojama neįdėjus vairuotojo kortelės ({{inf.recorded}}). Reglamento (ES) Nr. 165/2014 34 straipsnio 1 dalis.
explanation.infringement.SPEEDING_EVENT={{inf.date}} tachografas užregistravo greičio viršijimo įvykį ({{inf.recorded}}, laikotarpis {{inf.period}}).
