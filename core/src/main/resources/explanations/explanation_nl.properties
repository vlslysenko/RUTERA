explanation.infringement.DAILY_DRIVING_EXCEEDED=Op {{inf.date}} bedroeg de dagelijkse rijtijd {{inf.recorded}}; de norm is {{inf.limit}} (overschrijding {{inf.excess}}). Artikel 6, lid 1, Verordening (EG) nr. 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=In de week {{inf.period}} is de dagelijkse rijtijd meer dan twee keer verlengd tot 10 uur ({{inf.recorded}}). Artikel 6, lid 1, Verordening (EG) nr. 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=In de week {{inf.period}} bedroeg de wekelijkse rijtijd {{inf.recorded}}; de norm is 56 u (overschrijding {{inf.excess}}). Artikel 6, lid 2, Verordening (EG) nr. 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=In de twee opeenvolgende weken {{inf.period}} bedroeg de totale rijtijd {{inf.recorded}}; de norm is 90 u (overschrijding {{inf.excess}}). Artikel 6, lid 3, Verordening (EG) nr. 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=Op {{inf.date}} ({{inf.period}}) is {{inf.recorded}} gereden zonder de verplichte onderbreking van ten minste 45 minuten; de norm is 4 u 30 min (overschrijding {{inf.excess}}). Artikel 7 Verordening (EG) nr. 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=Op {{inf.date}} bedroeg de dagelijkse rusttijd {{inf.recorded}}; het verplichte minimum is {{inf.limit}} (tekort {{inf.excess}}). Artikel 8 Verordening (EG) nr. 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=De wekelijkse rusttijd in de periode {{inf.period}} bedroeg {{inf.recorded}}; het verplichte minimum is {{inf.limit}} (tekort {{inf.excess}}). Artikel 8, lid 6, Verordening (EG) nr. 561/2006.
explanation.infringement.WEEKLY_REST_LATE=De wekelijkse rusttijd is niet uiterlijk na zes perioden van 24 uur na het einde van de vorige wekelijkse rusttijd begonnen (periode {{inf.period}}, vertraging {{inf.excess}}). Artikel 8, lid 6, Verordening (EG) nr. 561/2006.
explanation.infringement.REST_INTERRUPTED=Op {{inf.date}} is de onderbreking of rusttijd onderbroken ({{inf.period}}, {{inf.recorded}}). Artikelen 7 tot en met 9 Verordening (EG) nr. 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=Op {{inf.date}} bedroeg de arbeidstijd {{inf.recorded}} en was de pauze korter dan voorgeschreven ({{inf.limit}}; tekort {{inf.excess}}). Artikel 5 Richtlijn 2002/15/EG zoals omgezet in nationaal recht.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=Op {{inf.date}}, met nachtarbeid, bedroeg de arbeidstijd {{inf.recorded}}; de norm is 10 u (overschrijding {{inf.excess}}). Artikel 7 Richtlijn 2002/15/EG zoals omgezet in nationaal recht.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=In de week {{inf.period}} bedroeg de arbeidstijd {{inf.recorded}}; de norm is {{inf.limit}} (overschrijding {{inf.excess}}). Artikel 4 Richtlijn 2002/15/EG zoals omgezet in nationaal recht.
explanation.infringement.MISSING_MANUAL_ENTRY=Voor de periode {{inf.period}} ({{inf.recorded}}) ontbreken registraties van activiteiten; er is geen handmatige invoer gedaan. Artikel 34, lid 3, Verordening (EU) nr. 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=Op {{inf.date}} is het landsymbool (begin of einde van de dagelijkse werkperiode of grensovergang) niet ingevoerd: {{inf.recorded}}. Artikel 34, lid 7, Verordening (EU) nr. 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=Op {{inf.date}} ({{inf.period}}) is met het voertuig {{vehicle.plate}} gereden zonder ingestoken bestuurderskaart ({{inf.recorded}}). Artikel 34, lid 1, Verordening (EU) nr. 165/2014.
explanation.infringement.SPEEDING_EVENT=Op {{inf.date}} heeft de tachograaf een snelheidsoverschrijding geregistreerd ({{inf.recorded}}, periode {{inf.period}}).
explanation.infringement.OTHER=Op {{inf.date}} is de volgende onregelmatigheid vastgesteld: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=onverwachte file na een ongeval
explanation.reason.TRAFFIC_ACCIDENT.text=De oorzaak was een onverwachte file als gevolg van een verkeersongeval, die bij de planning van de rit niet te voorzien was.
explanation.reason.ROAD_CLOSURE_DETOUR.short=plotselinge wegafsluiting / omleiding
explanation.reason.ROAD_CLOSURE_DETOUR.text=De oorzaak was een plotselinge wegafsluiting met een omleiding, die vóór het begin van de rit niet bekend was.
explanation.reason.EXTREME_WEATHER.short=plotseling extreem weer
explanation.reason.EXTREME_WEATHER.text=De oorzaak was een plotselinge ernstige verslechtering van weer en wegomstandigheden (bijv. sneeuwstorm, ijzel, storm), waardoor veilig stoppen of volgens plan doorrijden niet mogelijk was.
explanation.reason.NO_PARKING_SPACE.short=geen vrije plaats op de parkeerplaats
explanation.reason.NO_PARKING_SPACE.text=Op de geplande stopplaats en op de daarna geprobeerde parkeerplaatsen was geen geschikte vrije plaats voor het voertuig; er is alleen doorgereden tot de dichtstbijzijnde geschikte stopplaats.
explanation.reason.SECURITY_THREAT.short=gevaar voor bestuurder, voertuig of lading
explanation.reason.SECURITY_THREAT.text=Stoppen op de plaats waar de norm werd bereikt, zou de veiligheid van de bestuurder, het voertuig of de lading in gevaar hebben gebracht (bijv. risico op diefstal of overval, onveilige vluchtstrook).
explanation.reason.VEHICLE_BREAKDOWN.short=pech met het voertuig
explanation.reason.VEHICLE_BREAKDOWN.text=Door pech met het voertuig moest een veilige plaats of een werkplaats worden bereikt.
explanation.reason.LOAD_SAFETY.short=veiligheid van de lading
explanation.reason.LOAD_SAFETY.text=De lading moest worden beveiligd (bijv. verschoven lading, uitval van de koelunit, gevaarlijke stoffen) en daarvoor moest een plaats worden bereikt waar dat veilig kon.
explanation.reason.MEDICAL_EMERGENCY.short=medisch noodgeval / eerste hulp
explanation.reason.MEDICAL_EMERGENCY.text=De oorzaak was een medisch noodgeval of de noodzaak om eerste hulp te verlenen aan een andere persoon.
explanation.reason.AUTHORITY_ORDER.short=bevel van politie / instantie / terminalpersoneel
explanation.reason.AUTHORITY_ORDER.text=De onderbreking of rusttijd is onderbroken op bevel van de politie, een andere instantie of bevoegd terminalpersoneel om het voertuig te verplaatsen (richtsnoer nr. 3 van de Commissie).
explanation.reason.FERRY_TRAIN_DELAY.short=vertraging van veerboot of trein
explanation.reason.FERRY_TRAIN_DELAY.text=De oorzaak was een vertraging of wijziging van de vertrek- of aankomsttijd van de gebruikte veerboot of trein.
explanation.reason.REACH_HOME_OR_BASE.short=bereiken van de vestiging of woonplaats voor de wekelijkse rust
explanation.reason.REACH_HOME_OR_BASE.text=In uitzonderlijke omstandigheden is de rijtijd overschreden om de operationele vestiging van de werkgever of de woonplaats van de bestuurder te bereiken om daar een wekelijkse rusttijd te nemen.
explanation.reason.LOADING_DELAY.short=uitgelopen laden / lossen
explanation.reason.LOADING_DELAY.text=De oorzaak was uitgelopen laden of lossen of wachttijd bij de klant.
explanation.reason.DISPATCH_INSTRUCTION.short=opdracht van planner of klant
explanation.reason.DISPATCH_INSTRUCTION.text=Er is doorgereden op aanwijzing van de planner of de klant.
explanation.reason.OWN_PLANNING_ERROR.short=eigen inschattingsfout van tijd of route
explanation.reason.OWN_PLANNING_ERROR.text=De oorzaak was een eigen verkeerde inschatting van de resterende rijtijd of van de route.
explanation.reason.RECORDING_ERROR.short=bedieningsfout van de tachograaf
explanation.reason.RECORDING_ERROR.text=De oorzaak was een bedieningsfout van de tachograaf (bijv. verkeerde activiteit gekozen, handmatige invoer of landsymbool vergeten); de werkelijk verrichte activiteiten zijn hieronder beschreven.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=defect van bestuurderskaart of tachograaf
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=De oorzaak was een defect van de bestuurderskaart of de tachograaf; de activiteiten zijn op afdrukken geregistreerd overeenkomstig de artikelen 35 en 37 van Verordening (EU) nr. 165/2014.
explanation.reason.DATA_DISPUTE.short=vaststelling betwist
explanation.reason.DATA_DISPUTE.text=Ik ben het er niet mee eens dat er een overtreding heeft plaatsgevonden, om de hieronder vermelde redenen.
explanation.reason.OTHER.short=andere reden
explanation.reason.OTHER.text=De reden is hieronder beschreven.
explanation.art12.claimSafety=Ik beroep mij op artikel 12, eerste alinea, van Verordening (EG) nr. 561/2006. De afwijking was nodig om de veiligheid van personen, het voertuig of de lading te waarborgen en een geschikte stopplaats te bereiken ({{art12.stopPlace}}); de verkeersveiligheid is daarbij niet in gevaar gebracht.
explanation.art12.claimHome1h=Ik beroep mij op artikel 12, tweede alinea, van Verordening (EG) nr. 561/2006: in uitzonderlijke omstandigheden is de dagelijkse of wekelijkse rijtijd met {{inf.excess}} (ten hoogste 1 uur) overschreden om {{art12.destination}} te bereiken voor een wekelijkse rusttijd.
explanation.art12.claimHome2h=Ik beroep mij op artikel 12, derde alinea, van Verordening (EG) nr. 561/2006: in uitzonderlijke omstandigheden is de dagelijkse of wekelijkse rijtijd met {{inf.excess}} (ten hoogste 2 uur) overschreden om {{art12.destination}} te bereiken voor een normale wekelijkse rusttijd; direct voorafgaand aan de extra rijtijd is een ononderbroken pauze van 30 minuten genomen ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Ik ben ervan op de hoogte dat de verlenging moet worden gecompenseerd door een gelijkwaardige rusttijd die in zijn geheel samen met een willekeurige rusttijd wordt genomen vóór het einde van de derde week na de week in kwestie.
explanation.art12.noteMade=De aard van en de reden voor de afwijking zijn op {{art12.noteDate}} om {{art12.noteTime}}, uiterlijk bij aankomst op de stopplaats, met de hand op de afdruk van de tachograaf (of het registratieblad) vermeld. Een kopie of foto is bijgevoegd.
explanation.art12.noteNotMade=Op het moment van het voorval is op de afdruk van de tachograaf geen handgeschreven aantekening van de afwijking gemaakt.
explanation.art12.notClaimed=Ik beroep mij niet op artikel 12 van Verordening (EG) nr. 561/2006.
explanation.declaration.truth=Ik verklaar dat deze verklaring naar waarheid en vrijwillig is afgelegd. Ik heb kennisgenomen van de tachograafgegevens waarop de vaststelling is gebaseerd.
explanation.declaration.dispute=Ik ben het om de volgende reden niet eens met de vaststelling: {{dispute.text}}
explanation.employer.received=Verklaring ontvangen op {{employer.date}} door {{employer.signatory}}.
explanation.employer.assessJustified=Beoordeling: de afwijking is gerechtvaardigd (uitzonderlijke, onvoorzienbare omstandigheden).
explanation.employer.assessNotJustified=Beoordeling: de verklaring rechtvaardigt de overtreding niet.
explanation.employer.assessPending=Beoordeling: nadere opheldering is nodig.
explanation.employer.instructed=De bestuurder is geïnstrueerd over de regels inzake rijtijden, onderbrekingen en rusttijden (artikelen 6 tot en met 9 van Verordening (EG) nr. 561/2006) en over de plicht om de aard van en de reden voor een afwijking uiterlijk bij aankomst op een geschikte stopplaats met de hand op de afdruk te vermelden.
explanation.employer.actions=Genomen maatregelen: {{employer.actions}}
explanation.employer.refusal=De bestuurder heeft op {{refusal.date}} geweigerd een verklaring af te leggen / te tekenen. Getuige: {{refusal.witness}}.
explanation.signature.driver=Handtekening bestuurder
explanation.signature.employer=Handtekening werkgever of gemachtigde
explanation.signature.electronic=Op het scherm ondertekend in de applicatie RUTERA op {{sign.timestamp}}.
explanation.printout.instruction=Schrijf deze tekst uiterlijk bij aankomst op de stopplaats met de hand op de achterkant van de tachograafafdruk (of op het registratieblad) en onderteken. Bewaar de afdruk in het voertuig.
explanation.printout.art12Safety={{date}} {{time}} Art. 12 Vo. (EG) 561/2006: {{reasonShort}}, {{location}}. {{infringementShort}} {{excess}} om een veilige stopplaats te bereiken: {{stopPlace}}. {{driverName}}, kaart {{cardNumber}}, {{plate}}.
