explanation.infringement.WEEKLY_DRIVING_EXCEEDED=A(z) {{inf.period}} héten a heti vezetési idő {{inf.recorded}} volt; a megengedett érték 56 óra (túllépés: {{inf.excess}}). 561/2006/EK rendelet 6. cikk (2) bekezdés.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=A(z) {{inf.period}} két egymást követő héten az összesített vezetési idő {{inf.recorded}} volt; a megengedett érték 90 óra (túllépés: {{inf.excess}}). 561/2006/EK rendelet 6. cikk (3) bekezdés.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED={{inf.date}} napon ({{inf.period}}) a járművet {{inf.recorded}} időtartamban vezették a kötelező, legalább 45 perces szünet nélkül; a megengedett érték 4 óra 30 perc (túllépés: {{inf.excess}}). 561/2006/EK rendelet 7. cikk.
explanation.infringement.DAILY_REST_INSUFFICIENT={{inf.date}} napon a napi pihenőidő {{inf.recorded}} volt; a kötelező minimum {{inf.limit}} (csökkentés: {{inf.excess}}). 561/2006/EK rendelet 8. cikk.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=A(z) {{inf.period}} időszakban a heti pihenőidő {{inf.recorded}} volt; a kötelező minimum {{inf.limit}} (csökkentés: {{inf.excess}}). 561/2006/EK rendelet 8. cikk (6) bekezdés.
explanation.infringement.WEEKLY_REST_LATE=A heti pihenőidő nem kezdődött meg legkésőbb az előző heti pihenőidő végét követő hat 24 órás időszak végén (időszak: {{inf.period}}, késés: {{inf.excess}}). 561/2006/EK rendelet 8. cikk (6) bekezdés.
explanation.infringement.REST_INTERRUPTED={{inf.date}} napon a szünetet vagy a pihenőidőt megszakították ({{inf.period}}, {{inf.recorded}}). 561/2006/EK rendelet 7–9. cikk.
explanation.infringement.WORK_BREAK_INSUFFICIENT={{inf.date}} napon a munkaidő {{inf.recorded}} volt, és a munkaközi szünet rövidebb volt az előírtnál ({{inf.limit}}; hiány: {{inf.excess}}). 2002/15/EK irányelv 5. cikk a nemzeti jog szerint.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED={{inf.date}} napon, éjszakai munkavégzés mellett a munkaidő {{inf.recorded}} volt; a megengedett érték 10 óra (túllépés: {{inf.excess}}). 2002/15/EK irányelv 7. cikk a nemzeti jog szerint.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=A(z) {{inf.period}} héten a munkaidő {{inf.recorded}} volt; a megengedett érték {{inf.limit}} (túllépés: {{inf.excess}}). 2002/15/EK irányelv 4. cikk a nemzeti jog szerint.
explanation.infringement.MISSING_MANUAL_ENTRY=A(z) {{inf.period}} időszakra ({{inf.recorded}}) nincs tevékenységrögzítés; kézi bevitel nem történt. 165/2014/EU rendelet 34. cikk (3) bekezdés.
explanation.infringement.MISSING_COUNTRY_SYMBOL={{inf.date}} napon nem rögzítették az ország jelét (a napi munkaidő kezdete vagy vége, illetve határátlépés): {{inf.recorded}}. 165/2014/EU rendelet 34. cikk (7) bekezdés.
explanation.infringement.DRIVING_WITHOUT_CARD={{inf.date}} napon ({{inf.period}}) a(z) {{vehicle.plate}} járművet behelyezett járművezetői kártya nélkül vezették ({{inf.recorded}}). 165/2014/EU rendelet 34. cikk (1) bekezdés.
explanation.infringement.SPEEDING_EVENT={{inf.date}} napon a menetíró készülék sebességtúllépési eseményt rögzített ({{inf.recorded}}, időszak: {{inf.period}}).
