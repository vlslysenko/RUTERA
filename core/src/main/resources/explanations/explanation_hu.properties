explanation.infringement.DAILY_DRIVING_EXCEEDED={{inf.date}} napon a napi vezetési idő {{inf.recorded}} volt; a megengedett érték {{inf.limit}} (túllépés: {{inf.excess}}). 561/2006/EK rendelet 6. cikk (1) bekezdés.
