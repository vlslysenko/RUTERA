explanation.printout.art12Home={{date}} {{time}} 561/2006/EK r. 12. cikk 2./3. bek.: vezetési idő túllépése {{excess}}, hogy elérjem: {{destination}}, heti pihenőhöz. Szünet 30 perc {{breakFrom}}-{{breakTo}}. Ok: {{reasonShort}}. {{driverName}}, kártya {{cardNumber}}, {{plate}}.
explanation.printout.restInterrupted={{date}} {{time}} Pihenőidő megszakítva {{minutes}} percre {{authority}} utasítására a jármű áthelyezése miatt, {{location}}. {{driverName}}, kártya {{cardNumber}}, {{plate}}.
