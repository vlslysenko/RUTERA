explanation.reason.TRAFFIC_ACCIDENT.short=baleset miatti váratlan torlódás
explanation.reason.TRAFFIC_ACCIDENT.text=Az ok egy közlekedési baleset miatt kialakult váratlan torlódás volt, amelyet az útvonal tervezésekor nem lehetett előre látni.
explanation.reason.ROAD_CLOSURE_DETOUR.short=hirtelen útlezárás / terelés
explanation.reason.ROAD_CLOSURE_DETOUR.text=Az ok egy hirtelen útlezárás és elrendelt terelés volt, amelyekről az indulás előtt nem lehetett tudni.
explanation.reason.EXTREME_WEATHER.short=hirtelen szélsőséges időjárás
explanation.reason.EXTREME_WEATHER.text=Az ok az időjárási és útviszonyok hirtelen, súlyos romlása volt (pl. hóvihar, ónos eső, viharos szél), amely nem tette lehetővé a biztonságos megállást vagy a terv szerinti továbbhaladást.
explanation.reason.NO_PARKING_SPACE.short=nem volt szabad hely a parkolóban
explanation.reason.NO_PARKING_SPACE.text=A tervezett megállóhelyen és az ezt követően felkeresett parkolókban nem volt a járműnek megfelelő szabad hely; a járművezető csak a legközelebbi megfelelő megállóhelyig haladt tovább.
explanation.reason.SECURITY_THREAT.short=a járművezető, a jármű vagy a rakomány veszélyeztetése
explanation.reason.SECURITY_THREAT.text=A megállás azon a helyen, ahol a határérték lejárt, veszélyeztette volna a járművezető, a jármű vagy a rakomány biztonságát (pl. lopás vagy támadás veszélye, veszélyes útpadka).
explanation.reason.VEHICLE_BREAKDOWN.short=a jármű meghibásodása
explanation.reason.VEHICLE_BREAKDOWN.text=A jármű meghibásodása miatt biztonságos helyre vagy javítóműhelybe kellett eljutni.
explanation.reason.LOAD_SAFETY.short=a rakomány biztonsága
explanation.reason.LOAD_SAFETY.text=A rakományt biztosítani kellett (pl. elmozdult rakomány, a hűtőaggregát meghibásodása, veszélyes áru), és el kellett jutni egy olyan helyre, ahol ez biztonságosan elvégezhető volt.
explanation.reason.MEDICAL_EMERGENCY.short=egészségügyi vészhelyzet / elsősegélynyújtás
explanation.reason.MEDICAL_EMERGENCY.text=Az ok egy hirtelen egészségügyi probléma vagy egy másik személynek nyújtandó elsősegély volt.
explanation.reason.AUTHORITY_ORDER.short=rendőrség / hatóság / terminálszemélyzet utasítása
explanation.reason.AUTHORITY_ORDER.text=A szünetet vagy a pihenőidőt a rendőrség, más hatóság vagy a terminál arra jogosult személyzetének utasítására szakították meg a jármű áthelyezése céljából (a Bizottság 3. számú iránymutatása).
explanation.reason.FERRY_TRAIN_DELAY.short=a komp vagy a vonat késése
explanation.reason.FERRY_TRAIN_DELAY.text=Az ok az igénybe vett komp vagy vonat késése, illetve indulási vagy érkezési idejének változása volt.
explanation.reason.REACH_HOME_OR_BASE.short=a működési központ vagy a lakóhely elérése a heti pihenőhöz
explanation.reason.REACH_HOME_OR_BASE.text=Kivételes körülmények között a vezetési időt túllépték, hogy a járművezető elérje a munkáltató működési központját vagy saját lakóhelyét a heti pihenőidő eltöltése céljából.
explanation.reason.LOADING_DELAY.short=elhúzódó be- / kirakodás
explanation.reason.LOADING_DELAY.text=Az ok az elhúzódó berakodás, kirakodás vagy a megbízónál történő várakozás volt.
explanation.reason.DISPATCH_INSTRUCTION.short=diszpécser vagy megbízó utasítása
explanation.reason.DISPATCH_INSTRUCTION.text=A továbbhaladás a diszpécser vagy a megbízó utasítására történt.
explanation.reason.OWN_PLANNING_ERROR.short=a hátralévő idő vagy az útvonal saját téves becslése
explanation.reason.OWN_PLANNING_ERROR.text=Az ok a hátralévő vezetési idő vagy az útvonal saját téves becslése volt.
explanation.reason.RECORDING_ERROR.short=a menetíró készülék kezelési hibája
explanation.reason.RECORDING_ERROR.text=Az ok a menetíró készülék kezelési hibája volt (pl. téves tevékenység kiválasztása, elmaradt kézi bevitel vagy országjel); a ténylegesen végzett tevékenységeket alább részletezem.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=a járművezetői kártya vagy a menetíró készülék hibája
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Az ok a járművezetői kártya vagy a menetíró készülék hibája volt; a tevékenységeket a 165/2014/EU rendelet 35. és 37. cikke szerint nyomtatványon rögzítettem.
explanation.reason.DATA_DISPUTE.short=a megállapítást vitatom
explanation.reason.DATA_DISPUTE.text=Nem értek egyet azzal, hogy jogsértés történt, az alább részletezett okok miatt.
explanation.reason.OTHER.short=egyéb ok
explanation.reason.OTHER.text=Az okot alább részletezem.
explanation.art12.claimSafety=Az 561/2006/EK rendelet 12. cikkének első bekezdésére hivatkozom. Az eltérés a személyek, a jármű vagy a rakomány biztonságának biztosításához és egy megfelelő megállóhely eléréséhez ({{art12.stopPlace}}) volt szükséges, és nem veszélyeztette a közúti közlekedés biztonságát.
explanation.art12.claimHome1h=Az 561/2006/EK rendelet 12. cikkének második bekezdésére hivatkozom: kivételes körülmények között a napi vagy heti vezetési időt {{inf.excess}} időtartammal (legfeljebb 1 órával) túlléptem, hogy a heti pihenőidő eltöltése céljából elérjem a következő helyet: {{art12.destination}}.
explanation.art12.claimHome2h=Az 561/2006/EK rendelet 12. cikkének harmadik bekezdésére hivatkozom: kivételes körülmények között a napi vagy heti vezetési időt {{inf.excess}} időtartammal (legfeljebb 2 órával) túlléptem, hogy a rendes heti pihenőidő eltöltése céljából elérjem a következő helyet: {{art12.destination}}; közvetlenül a többletvezetés előtt megszakítás nélküli 30 perces szünetet tartottam ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Tudomásul veszem, hogy a túllépést azzal egyenértékű, egyben kivett pihenőidővel kell ellentételezni, bármely pihenőidővel együtt, az érintett hetet követő harmadik hét végéig.
explanation.art12.noteMade=Az eltérés jellegét és okát {{art12.noteDate}} napon {{art12.noteTime}} órakor, legkésőbb a megállóhelyre érkezéskor, kézzel feltüntettem a menetíró készülék nyomtatványán (vagy adatrögzítő lapján). Másolata vagy fényképe mellékelve.
explanation.art12.noteNotMade=Az esemény idején a menetíró készülék nyomtatványán nem készült kézzel írt feljegyzés az eltérésről.
explanation.art12.notClaimed=Az 561/2006/EK rendelet 12. cikkére nem hivatkozom.
explanation.declaration.truth=Kijelentem, hogy e nyilatkozat a valóságnak megfelel, és azt önként teszem. A jogsértés megállapításának alapjául szolgáló menetíró adatokat megismertem.
explanation.declaration.dispute=A megállapítással a következő ok miatt nem értek egyet: {{dispute.text}}
explanation.employer.received=A nyilatkozatot átvette {{employer.date}} napon: {{employer.signatory}}.
explanation.employer.assessJustified=Értékelés: az eltérés indokolt (kivételes, előre nem látható körülmények).
explanation.employer.assessNotJustified=Értékelés: a nyilatkozat nem igazolja a jogsértést.
explanation.employer.assessPending=Értékelés: további tisztázás szükséges.
explanation.employer.instructed=A járművezetőt kioktattuk a vezetési időre, a szünetekre és a pihenőidőre vonatkozó szabályokról (561/2006/EK rendelet 6–9. cikk), valamint arról a kötelezettségről, hogy az eltérés jellegét és okát legkésőbb a megfelelő megállóhelyre érkezéskor kézzel fel kell tüntetni a menetíró készülék nyomtatványán.
explanation.employer.actions=Megtett intézkedések: {{employer.actions}}
explanation.employer.refusal=A járművezető {{refusal.date}} napon megtagadta a nyilatkozattételt / az aláírást. Tanú: {{refusal.witness}}.
explanation.signature.driver=A járművezető aláírása
explanation.signature.employer=A munkáltató vagy meghatalmazott személy aláírása
explanation.signature.electronic=Aláírva a képernyőn a RUTERA alkalmazásban: {{sign.timestamp}}.
explanation.printout.instruction=Írja ezt a szöveget kézzel a menetíró nyomtatvány hátoldalára (vagy az adatrögzítő lapra) legkésőbb a megállóhelyre érkezéskor, és írja alá. A nyomtatványt tartsa a járműben.
