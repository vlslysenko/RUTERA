explanation.employer.instructed=The driver was instructed on the rules on driving times, breaks and rest periods (Articles 6 to 9 of Regulation (EC) No 561/2006) and on the obligation to note the reason for any derogation by hand on the tachograph printout at the latest on arrival at a suitable stopping place.
