explanation.infringement.DAILY_DRIVING_EXCEEDED=On {{inf.date}} the daily driving time was {{inf.recorded}}; the limit is {{inf.limit}} (excess {{inf.excess}}). Article 6(1) of Regulation (EC) No 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=In the week {{inf.period}} the daily driving time was extended to 10 hours more than twice ({{inf.recorded}}). Article 6(1) of Regulation (EC) No 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=In the week {{inf.period}} the weekly driving time was {{inf.recorded}}; the limit is 56 h (excess {{inf.excess}}). Article 6(2) of Regulation (EC) No 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=In the two consecutive weeks {{inf.period}} the total driving time was {{inf.recorded}}; the limit is 90 h (excess {{inf.excess}}). Article 6(3) of Regulation (EC) No 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=On {{inf.date}} ({{inf.period}}) the vehicle was driven for {{inf.recorded}} without the required break of at least 45 minutes; the limit is 4 h 30 min (excess {{inf.excess}}). Article 7 of Regulation (EC) No 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=On {{inf.date}} the daily rest period was {{inf.recorded}}; the required minimum is {{inf.limit}} (shortfall {{inf.excess}}). Article 8 of Regulation (EC) No 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=The weekly rest period in {{inf.period}} was {{inf.recorded}}; the required minimum is {{inf.limit}} (shortfall {{inf.excess}}). Article 8(6) of Regulation (EC) No 561/2006.
explanation.infringement.WEEKLY_REST_LATE=The weekly rest period did not start within six 24-hour periods after the end of the previous weekly rest period (period {{inf.period}}, delay {{inf.excess}}). Article 8(6) of Regulation (EC) No 561/2006.
explanation.infringement.REST_INTERRUPTED=On {{inf.date}} the break or rest period was interrupted ({{inf.period}}, {{inf.recorded}}). Articles 7 to 9 of Regulation (EC) No 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=On {{inf.date}} the working time was {{inf.recorded}} and the break from work was shorter than required ({{inf.limit}}; shortfall {{inf.excess}}). Article 5 of Directive 2002/15/EC as applied in national law.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=On {{inf.date}}, with night work performed, the working time was {{inf.recorded}}; the limit is 10 h (excess {{inf.excess}}). Article 7 of Directive 2002/15/EC as applied in national law.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=In the week {{inf.period}} the working time was {{inf.recorded}}; the limit is {{inf.limit}} (excess {{inf.excess}}). Article 4 of Directive 2002/15/EC as applied in national law.
explanation.infringement.MISSING_MANUAL_ENTRY=There is no record of activities for the period {{inf.period}} ({{inf.recorded}}); no manual entry was made. Article 34(3) of Regulation (EU) No 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=On {{inf.date}} the country symbol (start or end of the daily working period or border crossing) was not entered: {{inf.recorded}}. Article 34(7) of Regulation (EU) No 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=On {{inf.date}} ({{inf.period}}) the vehicle {{vehicle.plate}} was driven without a driver card inserted ({{inf.recorded}}). Article 34(1) of Regulation (EU) No 165/2014.
explanation.infringement.SPEEDING_EVENT=On {{inf.date}} the tachograph recorded an overspeeding event ({{inf.recorded}}, period {{inf.period}}).
explanation.infringement.OTHER=On {{inf.date}} the following irregularity was found: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=unexpected traffic jam after an accident
explanation.reason.TRAFFIC_ACCIDENT.text=The cause was an unexpected traffic jam resulting from a road accident, which could not be foreseen when the journey was planned.
explanation.reason.ROAD_CLOSURE_DETOUR.short=sudden road closure / detour
explanation.reason.ROAD_CLOSURE_DETOUR.text=The cause was a sudden road closure and an imposed detour that were not known before the journey started.
explanation.reason.EXTREME_WEATHER.short=sudden extreme weather
explanation.reason.EXTREME_WEATHER.text=The cause was a sudden severe deterioration of weather and road conditions (e.g. snowstorm, black ice, storm) which made it unsafe to stop or continue as planned.
explanation.reason.NO_PARKING_SPACE.short=no free space at the parking area
explanation.reason.NO_PARKING_SPACE.text=At the planned stopping place, and at the parking areas tried afterwards, there was no free space suitable for the vehicle; driving continued only to the nearest suitable stopping place.
explanation.reason.SECURITY_THREAT.short=unsafe place, risk to driver, vehicle or load
explanation.reason.SECURITY_THREAT.text=Stopping at the place where the limit was reached would have endangered the safety of the driver, the vehicle or the load (e.g. risk of theft or attack, unsafe road shoulder).
explanation.reason.VEHICLE_BREAKDOWN.short=vehicle breakdown
explanation.reason.VEHICLE_BREAKDOWN.text=Because of a vehicle breakdown it was necessary to reach a safe place or a repair point.
explanation.reason.LOAD_SAFETY.short=load safety
explanation.reason.LOAD_SAFETY.text=It was necessary to protect the load (e.g. shifted load, failure of the refrigeration unit, dangerous goods) and to reach a place where this could be done safely.
explanation.reason.MEDICAL_EMERGENCY.short=medical emergency / first aid
explanation.reason.MEDICAL_EMERGENCY.text=The cause was a medical emergency or the need to give first aid to another person.
explanation.reason.AUTHORITY_ORDER.short=order of police / authority / terminal staff
explanation.reason.AUTHORITY_ORDER.text=The break or rest period was interrupted on the order of the police, another authority or authorised terminal staff, in order to move the vehicle (Commission Guidance Note 3).
explanation.reason.FERRY_TRAIN_DELAY.short=ferry or train delay
explanation.reason.FERRY_TRAIN_DELAY.text=The cause was a delay or a change in the departure or arrival of the ferry or train used in the journey.
explanation.reason.REACH_HOME_OR_BASE.short=reaching the operational centre or home for weekly rest
explanation.reason.REACH_HOME_OR_BASE.text=In exceptional circumstances the driving time was extended to reach the employer's operational centre or the driver's place of residence in order to take a weekly rest period.
explanation.reason.LOADING_DELAY.short=prolonged loading / unloading
explanation.reason.LOADING_DELAY.text=The cause was a prolonged loading or unloading or waiting time at the customer.
explanation.reason.DISPATCH_INSTRUCTION.short=instruction from dispatcher or customer
explanation.reason.DISPATCH_INSTRUCTION.text=The driving was continued on the instruction of the dispatcher or the customer.
explanation.reason.OWN_PLANNING_ERROR.short=own misjudgement of time or route
explanation.reason.OWN_PLANNING_ERROR.text=The cause was the driver's own misjudgement of the remaining driving time or of the route.
explanation.reason.RECORDING_ERROR.short=operating error of the tachograph
explanation.reason.RECORDING_ERROR.text=The cause was an operating error of the tachograph (e.g. wrong activity selected, manual entry or country symbol forgotten); the activities actually performed are described below.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=driver card or tachograph malfunction
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=The cause was a malfunction of the driver card or of the tachograph; the activities were recorded on printouts as required by Articles 35 and 37 of Regulation (EU) No 165/2014.
explanation.reason.DATA_DISPUTE.short=finding disputed
explanation.reason.DATA_DISPUTE.text=I do not agree that an infringement occurred, for the reasons given below.
explanation.reason.OTHER.short=other reason
explanation.reason.OTHER.text=The cause is described below.
explanation.art12.claimSafety=I rely on Article 12 (first paragraph) of Regulation (EC) No 561/2006. The departure from the rules was necessary to ensure the safety of persons, the vehicle or its load and to reach a suitable stopping place ({{art12.stopPlace}}); it did not jeopardise road safety.
explanation.art12.claimHome1h=I rely on Article 12 (second paragraph) of Regulation (EC) No 561/2006: in exceptional circumstances the daily or weekly driving time was exceeded by {{inf.excess}} (at most 1 hour) to reach {{art12.destination}} in order to take a weekly rest period.
explanation.art12.claimHome2h=I rely on Article 12 (third paragraph) of Regulation (EC) No 561/2006: in exceptional circumstances the daily or weekly driving time was exceeded by {{inf.excess}} (at most 2 hours) to reach {{art12.destination}} in order to take a regular weekly rest period; an uninterrupted break of 30 minutes was taken immediately before the additional driving ({{art12.breakFrom}} to {{art12.breakTo}}).
explanation.art12.compensation=I acknowledge that the extension must be compensated by an equivalent period of rest taken en bloc with any rest period by the end of the third week following the week concerned.
explanation.art12.noteMade=The type of and reason for the derogation were written by hand on the tachograph printout (or record sheet) on {{art12.noteDate}} at {{art12.noteTime}}, at the latest on arrival at the stopping place. A copy or photo is attached.
explanation.art12.noteNotMade=No handwritten note about the derogation was made on the tachograph printout at the time of the event.
explanation.art12.notClaimed=I do not rely on Article 12 of Regulation (EC) No 561/2006.
explanation.declaration.truth=I declare that this explanation is true and given voluntarily. I have seen the tachograph data on which the infringement was found.
explanation.declaration.dispute=I do not agree with the finding for the following reason: {{dispute.text}}
