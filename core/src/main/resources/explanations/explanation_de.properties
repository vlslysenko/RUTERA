explanation.infringement.DAILY_DRIVING_EXCEEDED=Am {{inf.date}} betrug die Tageslenkzeit {{inf.recorded}}; zulässig sind {{inf.limit}} (Überschreitung {{inf.excess}}). Art. 6 Abs. 1 VO (EG) Nr. 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=In der Woche {{inf.period}} wurde die Tageslenkzeit mehr als zweimal auf 10 Stunden verlängert ({{inf.recorded}}). Art. 6 Abs. 1 VO (EG) Nr. 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=In der Woche {{inf.period}} betrug die wöchentliche Lenkzeit {{inf.recorded}}; zulässig sind 56 Std. (Überschreitung {{inf.excess}}). Art. 6 Abs. 2 VO (EG) Nr. 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=In den zwei aufeinanderfolgenden Wochen {{inf.period}} betrug die Gesamtlenkzeit {{inf.recorded}}; zulässig sind 90 Std. (Überschreitung {{inf.excess}}). Art. 6 Abs. 3 VO (EG) Nr. 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=Am {{inf.date}} ({{inf.period}}) wurde {{inf.recorded}} ohne die vorgeschriebene Fahrtunterbrechung von mindestens 45 Minuten gelenkt; zulässig sind 4 Std. 30 Min. (Überschreitung {{inf.excess}}). Art. 7 VO (EG) Nr. 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=Am {{inf.date}} betrug die tägliche Ruhezeit {{inf.recorded}}; vorgeschrieben sind mindestens {{inf.limit}} (Unterschreitung {{inf.excess}}). Art. 8 VO (EG) Nr. 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Die wöchentliche Ruhezeit im Zeitraum {{inf.period}} betrug {{inf.recorded}}; vorgeschrieben sind mindestens {{inf.limit}} (Unterschreitung {{inf.excess}}). Art. 8 Abs. 6 VO (EG) Nr. 561/2006.
explanation.infringement.WEEKLY_REST_LATE=Die wöchentliche Ruhezeit wurde nicht spätestens nach sechs 24-Stunden-Zeiträumen nach dem Ende der vorangegangenen wöchentlichen Ruhezeit angetreten (Zeitraum {{inf.period}}, Verspätung {{inf.excess}}). Art. 8 Abs. 6 VO (EG) Nr. 561/2006.
explanation.infringement.REST_INTERRUPTED=Am {{inf.date}} wurde die Fahrtunterbrechung oder Ruhezeit unterbrochen ({{inf.period}}, {{inf.recorded}}). Art. 7 bis 9 VO (EG) Nr. 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=Am {{inf.date}} betrug die Arbeitszeit {{inf.recorded}}; die Ruhepause war kürzer als vorgeschrieben ({{inf.limit}}; Unterschreitung {{inf.excess}}). § 4 ArbZG.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=Am {{inf.date}} betrug die Arbeitszeit bei geleisteter Nachtarbeit {{inf.recorded}}; zulässig sind 10 Std. (Überschreitung {{inf.excess}}). § 21a ArbZG.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=In der Woche {{inf.period}} betrug die Arbeitszeit {{inf.recorded}}; zulässig sind {{inf.limit}} (Überschreitung {{inf.excess}}). § 21a ArbZG.
explanation.infringement.MISSING_MANUAL_ENTRY=Für den Zeitraum {{inf.period}} ({{inf.recorded}}) liegen keine Aufzeichnungen vor; ein manueller Nachtrag wurde nicht vorgenommen. Art. 34 Abs. 3 VO (EU) Nr. 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=Am {{inf.date}} wurde das Ländersymbol (Beginn oder Ende der täglichen Arbeitszeit oder Grenzübertritt) nicht eingegeben: {{inf.recorded}}. Art. 34 Abs. 7 VO (EU) Nr. 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=Am {{inf.date}} ({{inf.period}}) wurde das Fahrzeug {{vehicle.plate}} ohne gesteckte Fahrerkarte gelenkt ({{inf.recorded}}). Art. 34 Abs. 1 VO (EU) Nr. 165/2014.
explanation.infringement.SPEEDING_EVENT=Am {{inf.date}} hat der Fahrtenschreiber eine Geschwindigkeitsüberschreitung aufgezeichnet ({{inf.recorded}}, Zeitraum {{inf.period}}).
explanation.infringement.OTHER=Am {{inf.date}} wurde folgende Unregelmäßigkeit festgestellt: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=unvorhersehbarer Stau nach Unfall
explanation.reason.TRAFFIC_ACCIDENT.text=Ursache war ein unvorhersehbarer Stau infolge eines Verkehrsunfalls, der bei der Tourenplanung nicht absehbar war.
explanation.reason.ROAD_CLOSURE_DETOUR.short=plötzliche Straßensperrung / Umleitung
explanation.reason.ROAD_CLOSURE_DETOUR.text=Ursache war eine plötzliche Straßensperrung mit Umleitung, die vor Fahrtantritt nicht bekannt war.
explanation.reason.EXTREME_WEATHER.short=plötzliche extreme Wetterlage
explanation.reason.EXTREME_WEATHER.text=Ursache war eine plötzliche starke Verschlechterung der Wetter- und Straßenverhältnisse (z. B. Schneesturm, Glatteis, Sturm), die ein sicheres Anhalten oder planmäßiges Weiterfahren verhinderte.
explanation.reason.NO_PARKING_SPACE.short=kein freier Stellplatz
explanation.reason.NO_PARKING_SPACE.text=Auf dem geplanten Halteplatz und auf den danach angefahrenen Parkplätzen gab es keinen für das Fahrzeug geeigneten freien Stellplatz; die Fahrt wurde nur bis zum nächsten geeigneten Halteplatz fortgesetzt.
explanation.reason.SECURITY_THREAT.short=Gefahr für Fahrer, Fahrzeug oder Ladung
explanation.reason.SECURITY_THREAT.text=Ein Anhalten an der Stelle, an der der Grenzwert erreicht wurde, hätte die Sicherheit des Fahrers, des Fahrzeugs oder der Ladung gefährdet (z. B. Diebstahl- oder Überfallgefahr, unsicherer Seitenstreifen).
explanation.reason.VEHICLE_BREAKDOWN.short=Fahrzeugpanne
explanation.reason.VEHICLE_BREAKDOWN.text=Wegen einer Fahrzeugpanne musste ein sicherer Ort oder eine Werkstatt erreicht werden.
explanation.reason.LOAD_SAFETY.short=Ladungssicherheit
explanation.reason.LOAD_SAFETY.text=Die Ladung musste gesichert werden (z. B. verrutschte Ladung, Ausfall des Kühlaggregats, Gefahrgut), und dafür war ein geeigneter sicherer Ort zu erreichen.
explanation.reason.MEDICAL_EMERGENCY.short=medizinischer Notfall / Erste Hilfe
explanation.reason.MEDICAL_EMERGENCY.text=Ursache war ein medizinischer Notfall oder die Notwendigkeit, einer anderen Person Erste Hilfe zu leisten.
explanation.reason.AUTHORITY_ORDER.short=Anordnung von Polizei / Behörde / Terminalpersonal
explanation.reason.AUTHORITY_ORDER.text=Die Fahrtunterbrechung oder Ruhezeit wurde auf Anordnung der Polizei, einer anderen Behörde oder des befugten Terminalpersonals unterbrochen, um das Fahrzeug umzusetzen (EU-Leitlinie 3).
explanation.reason.FERRY_TRAIN_DELAY.short=Verspätung von Fähre oder Zug
explanation.reason.FERRY_TRAIN_DELAY.text=Ursache war eine Verspätung oder Fahrplanänderung der benutzten Fähre oder des Zuges.
explanation.reason.REACH_HOME_OR_BASE.short=Erreichen der Betriebsstätte oder des Wohnorts zur Wochenruhezeit
explanation.reason.REACH_HOME_OR_BASE.text=Unter außergewöhnlichen Umständen wurde die Lenkzeit überschritten, um die Betriebsstätte des Arbeitgebers oder den Wohnort des Fahrers zu erreichen und dort eine wöchentliche Ruhezeit einzulegen.
explanation.reason.LOADING_DELAY.short=verlängerte Be- / Entladung
explanation.reason.LOADING_DELAY.text=Ursache war eine verlängerte Be- oder Entladung bzw. Wartezeit beim Kunden.
explanation.reason.DISPATCH_INSTRUCTION.short=Anweisung von Disposition oder Kunde
explanation.reason.DISPATCH_INSTRUCTION.text=Die Fahrt wurde auf Anweisung der Disposition oder des Kunden fortgesetzt.
explanation.reason.OWN_PLANNING_ERROR.short=eigene Fehleinschätzung von Zeit oder Strecke
explanation.reason.OWN_PLANNING_ERROR.text=Ursache war eine eigene Fehleinschätzung der verbleibenden Lenkzeit oder der Strecke.
explanation.reason.RECORDING_ERROR.short=Bedienfehler am Fahrtenschreiber
explanation.reason.RECORDING_ERROR.text=Ursache war ein Bedienfehler am Fahrtenschreiber (z. B. falsche Tätigkeit gewählt, manueller Nachtrag oder Ländersymbol vergessen); die tatsächlich ausgeübten Tätigkeiten sind unten beschrieben.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=Defekt der Fahrerkarte oder des Fahrtenschreibers
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Ursache war ein Defekt der Fahrerkarte oder des Fahrtenschreibers; die Tätigkeiten wurden gemäß Art. 35 und 37 VO (EU) Nr. 165/2014 auf Ausdrucken aufgezeichnet.
explanation.reason.DATA_DISPUTE.short=Feststellung bestritten
explanation.reason.DATA_DISPUTE.text=Ich bin nicht der Ansicht, dass ein Verstoß vorliegt; die Gründe sind unten angegeben.
explanation.reason.OTHER.short=sonstiger Grund
explanation.reason.OTHER.text=Der Grund ist unten beschrieben.
explanation.art12.claimSafety=Ich berufe mich auf Artikel 12 Unterabsatz 1 der Verordnung (EG) Nr. 561/2006. Die Abweichung war erforderlich, um die Sicherheit von Personen, des Fahrzeugs oder seiner Ladung zu gewährleisten und einen geeigneten Halteplatz zu erreichen ({{art12.stopPlace}}); die Verkehrssicherheit wurde dadurch nicht gefährdet.
explanation.art12.claimHome1h=Ich berufe mich auf Artikel 12 Unterabsatz 2 der Verordnung (EG) Nr. 561/2006: Unter außergewöhnlichen Umständen wurde die tägliche oder wöchentliche Lenkzeit um {{inf.excess}} (höchstens 1 Stunde) überschritten, um {{art12.destination}} zu erreichen und eine wöchentliche Ruhezeit einzulegen.
explanation.art12.claimHome2h=Ich berufe mich auf Artikel 12 Unterabsatz 3 der Verordnung (EG) Nr. 561/2006: Unter außergewöhnlichen Umständen wurde die tägliche oder wöchentliche Lenkzeit um {{inf.excess}} (höchstens 2 Stunden) überschritten, um {{art12.destination}} zu erreichen und eine regelmäßige wöchentliche Ruhezeit einzulegen; unmittelbar vor der zusätzlichen Lenkzeit wurde eine ununterbrochene Fahrtunterbrechung von 30 Minuten eingelegt ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Mir ist bekannt, dass die Verlängerung durch eine gleichwertige Ruhepause auszugleichen ist, die zusammen mit einer beliebigen Ruhezeit bis zum Ende der dritten Woche nach der betreffenden Woche genommen werden muss.
explanation.art12.noteMade=Art und Grund der Abweichung wurden am {{art12.noteDate}} um {{art12.noteTime}}, spätestens bei Erreichen des Halteplatzes, handschriftlich auf dem Ausdruck des Fahrtenschreibers (bzw. dem Schaublatt) vermerkt. Eine Kopie oder ein Foto ist beigefügt.
explanation.art12.noteNotMade=Zum Zeitpunkt des Ereignisses wurde kein handschriftlicher Vermerk über die Abweichung auf dem Ausdruck des Fahrtenschreibers angebracht.
explanation.art12.notClaimed=Ich berufe mich nicht auf Artikel 12 der Verordnung (EG) Nr. 561/2006.
explanation.declaration.truth=Ich erkläre, dass diese Stellungnahme der Wahrheit entspricht und freiwillig abgegeben wird. Die Fahrtenschreiberdaten, auf denen die Feststellung beruht, wurden mir vorgelegt.
explanation.declaration.dispute=Ich bin mit der Feststellung aus folgendem Grund nicht einverstanden: {{dispute.text}}
explanation.employer.received=Stellungnahme entgegengenommen am {{employer.date}} von {{employer.signatory}}.
explanation.employer.assessJustified=Bewertung: Die Abweichung ist gerechtfertigt (außergewöhnliche, nicht vorhersehbare Umstände).
explanation.employer.assessNotJustified=Bewertung: Die Stellungnahme rechtfertigt den Verstoß nicht.
explanation.employer.assessPending=Bewertung: weitere Klärung erforderlich.
explanation.employer.instructed=Der Fahrer / die Fahrerin wurde über die Vorschriften zu Lenkzeiten, Fahrtunterbrechungen und Ruhezeiten (Art. 6 bis 9 VO (EG) Nr. 561/2006) sowie über die Pflicht belehrt, Art und Grund einer Abweichung spätestens bei Erreichen eines geeigneten Halteplatzes handschriftlich auf dem Ausdruck zu vermerken.
explanation.employer.actions=Getroffene Maßnahmen: {{employer.actions}}
explanation.employer.refusal=Der Fahrer / die Fahrerin hat die Stellungnahme / Unterschrift am {{refusal.date}} verweigert. Zeuge: {{refusal.witness}}.
explanation.signature.driver=Unterschrift Fahrer/in
explanation.signature.employer=Unterschrift Arbeitgeber oder bevollmächtigte Person
explanation.signature.electronic=Auf dem Bildschirm in der Anwendung RUTERA unterschrieben am {{sign.timestamp}}.
explanation.printout.instruction=Schreiben Sie diesen Text spätestens bei Erreichen des Halteplatzes handschriftlich auf die Rückseite des Ausdrucks (oder auf das Schaublatt) und unterschreiben Sie. Den Ausdruck im Fahrzeug mitführen.
explanation.printout.art12Safety={{date}} {{time}} Art. 12 VO (EG) 561/2006: {{reasonShort}}, {{location}}. {{infringementShort}} {{excess}}, um einen sicheren Halteplatz zu erreichen: {{stopPlace}}. {{driverName}}, Karte {{cardNumber}}, {{plate}}.
explanation.printout.art12Home={{date}} {{time}} Art. 12 UAbs. 2/3 VO (EG) 561/2006: Lenkzeit um {{excess}} überschritten, um {{destination}} zur wöchentlichen Ruhezeit zu erreichen. Pause 30 Min. {{breakFrom}}-{{breakTo}}. Grund: {{reasonShort}}. {{driverName}}, Karte {{cardNumber}}, {{plate}}.
