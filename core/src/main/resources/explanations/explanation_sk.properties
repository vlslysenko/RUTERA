explanation.infringement.DAILY_DRIVING_EXCEEDED=Dňa {{inf.date}} bol denný čas jazdy {{inf.recorded}}; limit je {{inf.limit}} (prekročenie o {{inf.excess}}). Čl. 6 ods. 1 nariadenia (ES) č. 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=V týždni {{inf.period}} bol denný čas jazdy predĺžený na 10 hodín viac ako dvakrát ({{inf.recorded}}). Čl. 6 ods. 1 nariadenia (ES) č. 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=V týždni {{inf.period}} bol týždenný čas jazdy {{inf.recorded}}; limit je 56 h (prekročenie o {{inf.excess}}). Čl. 6 ods. 2 nariadenia (ES) č. 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=V dvoch po sebe nasledujúcich týždňoch {{inf.period}} bol celkový čas jazdy {{inf.recorded}}; limit je 90 h (prekročenie o {{inf.excess}}). Čl. 6 ods. 3 nariadenia (ES) č. 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=Dňa {{inf.date}} ({{inf.period}}) bolo vozidlo vedené {{inf.recorded}} bez predpísanej prestávky v trvaní najmenej 45 minút; limit je 4 h 30 min (prekročenie o {{inf.excess}}). Čl. 7 nariadenia (ES) č. 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=Dňa {{inf.date}} bol denný odpočinok {{inf.recorded}}; požadované minimum je {{inf.limit}} (skrátenie o {{inf.excess}}). Čl. 8 nariadenia (ES) č. 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Týždenný odpočinok v období {{inf.period}} bol {{inf.recorded}}; požadované minimum je {{inf.limit}} (skrátenie o {{inf.excess}}). Čl. 8 ods. 6 nariadenia (ES) č. 561/2006.
explanation.infringement.WEEKLY_REST_LATE=Týždenný odpočinok sa nezačal najneskôr po šiestich 24-hodinových obdobiach od skončenia predchádzajúceho týždenného odpočinku (obdobie {{inf.period}}, oneskorenie {{inf.excess}}). Čl. 8 ods. 6 nariadenia (ES) č. 561/2006.
explanation.infringement.REST_INTERRUPTED=Dňa {{inf.date}} bola prestávka alebo doba odpočinku prerušená ({{inf.period}}, {{inf.recorded}}). Čl. 7 až 9 nariadenia (ES) č. 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=Dňa {{inf.date}} bol pracovný čas {{inf.recorded}} a prestávka v práci bola kratšia, ako je predpísané ({{inf.limit}}; chýba {{inf.excess}}). Čl. 5 smernice 2002/15/ES, zákon č. 462/2007 Z. z.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=Dňa {{inf.date}} pri nočnej práci bol pracovný čas {{inf.recorded}}; limit je 10 h (prekročenie o {{inf.excess}}). Čl. 7 smernice 2002/15/ES, zákon č. 462/2007 Z. z.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=V týždni {{inf.period}} bol pracovný čas {{inf.recorded}}; limit je {{inf.limit}} (prekročenie o {{inf.excess}}). Čl. 4 smernice 2002/15/ES, zákon č. 462/2007 Z. z.
explanation.infringement.MISSING_MANUAL_ENTRY=Za obdobie {{inf.period}} ({{inf.recorded}}) chýba záznam činností; ručný záznam nebol vykonaný. Čl. 34 ods. 3 nariadenia (EÚ) č. 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=Dňa {{inf.date}} nebol zadaný symbol krajiny (začiatok alebo koniec denného pracovného času alebo prekročenie hranice): {{inf.recorded}}. Čl. 34 ods. 7 nariadenia (EÚ) č. 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=Dňa {{inf.date}} ({{inf.period}}) bolo vozidlo {{vehicle.plate}} vedené bez vloženej karty vodiča ({{inf.recorded}}). Čl. 34 ods. 1 nariadenia (EÚ) č. 165/2014.
explanation.infringement.SPEEDING_EVENT=Dňa {{inf.date}} tachograf zaznamenal udalosť prekročenia rýchlosti ({{inf.recorded}}, obdobie {{inf.period}}).
explanation.infringement.OTHER=Dňa {{inf.date}} bola zistená táto nezrovnalosť: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=nepredvídaná zápcha po nehode
explanation.reason.TRAFFIC_ACCIDENT.text=Príčinou bola nepredvídaná dopravná zápcha spôsobená dopravnou nehodou, ktorú nebolo možné predvídať pri plánovaní jazdy.
explanation.reason.ROAD_CLOSURE_DETOUR.short=náhla uzávierka / obchádzka
explanation.reason.ROAD_CLOSURE_DETOUR.text=Príčinou bola náhla uzávierka cesty a nariadená obchádzka, o ktorých sa pred začiatkom jazdy nevedelo.
explanation.reason.EXTREME_WEATHER.short=náhle extrémne počasie
explanation.reason.EXTREME_WEATHER.text=Príčinou bolo náhle výrazné zhoršenie poveternostných a cestných podmienok (napr. snehová búrka, poľadovica, víchrica), ktoré neumožnilo bezpečne zastaviť alebo pokračovať podľa plánu.
explanation.reason.NO_PARKING_SPACE.short=žiadne voľné parkovacie miesto
explanation.reason.NO_PARKING_SPACE.text=Na plánovanom mieste zastavenia ani na ďalších skúšaných parkoviskách nebolo voľné miesto vhodné pre vozidlo; jazda pokračovala len k najbližšiemu vhodnému miestu na zastavenie.
explanation.reason.SECURITY_THREAT.short=ohrozenie vodiča, vozidla alebo nákladu
explanation.reason.SECURITY_THREAT.text=Zastavenie v mieste, kde bol limit dosiahnutý, by ohrozilo bezpečnosť vodiča, vozidla alebo nákladu (napr. riziko krádeže alebo prepadnutia, nebezpečná krajnica).
explanation.reason.VEHICLE_BREAKDOWN.short=porucha vozidla
explanation.reason.VEHICLE_BREAKDOWN.text=Pre poruchu vozidla bolo potrebné dostať sa na bezpečné miesto alebo do servisu.
explanation.reason.LOAD_SAFETY.short=zabezpečenie nákladu
explanation.reason.LOAD_SAFETY.text=Bolo potrebné zabezpečiť náklad (napr. posunutý náklad, porucha chladiaceho agregátu, nebezpečný tovar) a dostať sa na miesto, kde to bolo možné urobiť bezpečne.
explanation.reason.MEDICAL_EMERGENCY.short=zdravotné problémy / poskytnutie prvej pomoci
explanation.reason.MEDICAL_EMERGENCY.text=Príčinou bola náhla zdravotná situácia alebo potreba poskytnúť prvú pomoc inej osobe.
explanation.reason.AUTHORITY_ORDER.short=pokyn polície / úradu / obsluhy terminálu
explanation.reason.AUTHORITY_ORDER.text=Prestávka alebo odpočinok boli prerušené na pokyn polície, iného orgánu alebo oprávnenej obsluhy terminálu s cieľom preparkovať vozidlo (usmernenie Komisie č. 3).
explanation.reason.FERRY_TRAIN_DELAY.short=meškanie trajektu alebo vlaku
explanation.reason.FERRY_TRAIN_DELAY.text=Príčinou bolo meškanie alebo zmena času odchodu či príchodu použitého trajektu alebo vlaku.
explanation.reason.REACH_HOME_OR_BASE.short=dojazd do prevádzkového strediska alebo bydliska na týždenný odpočinok
explanation.reason.REACH_HOME_OR_BASE.text=Za výnimočných okolností bol čas jazdy prekročený, aby vodič dorazil do prevádzkového strediska zamestnávateľa alebo do miesta svojho bydliska a čerpal týždenný odpočinok.
explanation.reason.LOADING_DELAY.short=predĺžená nakládka / vykládka
explanation.reason.LOADING_DELAY.text=Príčinou bola predĺžená nakládka, vykládka alebo čakanie u zákazníka.
explanation.reason.DISPATCH_INSTRUCTION.short=pokyn dispečera alebo zákazníka
explanation.reason.DISPATCH_INSTRUCTION.text=V jazde sa pokračovalo na pokyn dispečera alebo zákazníka.
explanation.reason.OWN_PLANNING_ERROR.short=vlastný nesprávny odhad času alebo trasy
explanation.reason.OWN_PLANNING_ERROR.text=Príčinou bol vlastný nesprávny odhad zostávajúceho času jazdy alebo trasy.
explanation.reason.RECORDING_ERROR.short=chyba pri obsluhe tachografu
explanation.reason.RECORDING_ERROR.text=Príčinou bola chyba pri obsluhe tachografu (napr. zvolená nesprávna činnosť, vynechaný ručný záznam alebo symbol krajiny); skutočne vykonávané činnosti sú opísané nižšie.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=porucha karty vodiča alebo tachografu
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Príčinou bola porucha karty vodiča alebo tachografu; činnosti boli zaznamenané na výtlačkoch podľa čl. 35 a 37 nariadenia (EÚ) č. 165/2014.
explanation.reason.DATA_DISPUTE.short=zistenie namietam
explanation.reason.DATA_DISPUTE.text=Nesúhlasím s tým, že došlo k porušeniu, z dôvodov uvedených nižšie.
explanation.reason.OTHER.short=iný dôvod
explanation.reason.OTHER.text=Dôvod je opísaný nižšie.
explanation.art12.claimSafety=Odvolávam sa na čl. 12 prvý pododsek nariadenia (ES) č. 561/2006. Odchýlka bola nevyhnutná na zaistenie bezpečnosti osôb, vozidla alebo nákladu a na dosiahnutie vhodného miesta na zastavenie ({{art12.stopPlace}}); bezpečnosť cestnej premávky tým nebola ohrozená.
explanation.art12.claimHome1h=Odvolávam sa na čl. 12 druhý pododsek nariadenia (ES) č. 561/2006: za výnimočných okolností bol denný alebo týždenný čas jazdy prekročený o {{inf.excess}} (najviac 1 hodinu), aby bolo dosiahnuté {{art12.destination}} na účel čerpania týždenného odpočinku.
explanation.art12.claimHome2h=Odvolávam sa na čl. 12 tretí pododsek nariadenia (ES) č. 561/2006: za výnimočných okolností bol denný alebo týždenný čas jazdy prekročený o {{inf.excess}} (najviac 2 hodiny), aby bolo dosiahnuté {{art12.destination}} na účel čerpania pravidelného týždenného odpočinku; bezprostredne pred dodatočným časom jazdy bola čerpaná neprerušená 30-minútová prestávka ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Beriem na vedomie, že predĺženie sa musí vyrovnať rovnocennou dobou odpočinku čerpanou naraz spolu s akoukoľvek dobou odpočinku do konca tretieho týždňa nasledujúceho po príslušnom týždni.
explanation.art12.noteMade=Druh a dôvod odchýlky boli ručne zapísané na výtlačok z tachografu (alebo na záznamový list) dňa {{art12.noteDate}} o {{art12.noteTime}}, najneskôr po príchode na miesto zastavenia. Kópia alebo fotografia je priložená.
explanation.art12.noteNotMade=V čase udalosti nebola na výtlačku z tachografu urobená ručná poznámka o odchýlke.
explanation.art12.notClaimed=Neodvolávam sa na čl. 12 nariadenia (ES) č. 561/2006.
explanation.declaration.truth=Vyhlasujem, že toto vysvetlenie je pravdivé a podávam ho dobrovoľne. Bol(a) som oboznámený(á) s údajmi z tachografu, na základe ktorých bolo porušenie zistené.
explanation.declaration.dispute=So zistením nesúhlasím z tohto dôvodu: {{dispute.text}}
explanation.employer.received=Vysvetlenie prevzal(a) dňa {{employer.date}}: {{employer.signatory}}.
explanation.employer.assessJustified=Hodnotenie: odchýlka je odôvodnená (výnimočné, nepredvídateľné okolnosti).
explanation.employer.assessNotJustified=Hodnotenie: vysvetlenie porušenie neospravedlňuje.
explanation.employer.assessPending=Hodnotenie: je potrebné ďalšie objasnenie.
explanation.employer.instructed=Vodič bol poučený o pravidlách pre čas jazdy, prestávky a doby odpočinku (čl. 6 až 9 nariadenia (ES) č. 561/2006) a o povinnosti ručne zapísať druh a dôvod odchýlky na výtlačok z tachografu najneskôr po príchode na vhodné miesto na zastavenie.
explanation.employer.actions=Prijaté opatrenia: {{employer.actions}}
explanation.employer.refusal=Vodič dňa {{refusal.date}} odmietol podať vysvetlenie / podpísať. Svedok: {{refusal.witness}}.
explanation.signature.driver=Podpis vodiča
explanation.signature.employer=Podpis zamestnávateľa alebo poverenej osoby
explanation.signature.electronic=Podpísané na obrazovke v aplikácii RUTERA dňa {{sign.timestamp}}.
explanation.printout.instruction=Napíšte tento text ručne na zadnú stranu výtlačku z tachografu (alebo na záznamový list) najneskôr po príchode na miesto zastavenia a podpíšte. Výtlačok uchovávajte vo vozidle.
explanation.printout.art12Safety={{date}} {{time}} Čl. 12 nar. (ES) 561/2006: {{reasonShort}}, {{location}}. {{infringementShort}} {{excess}} s cieľom dosiahnuť bezpečné miesto na zastavenie: {{stopPlace}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.art12Home={{date}} {{time}} Čl. 12 podods. 2/3 nar. (ES) 561/2006: čas jazdy prekročený o {{excess}} s cieľom dosiahnuť {{destination}} na týždenný odpočinok. Prestávka 30 min {{breakFrom}}-{{breakTo}}. Dôvod: {{reasonShort}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.restInterrupted={{date}} {{time}} Odpočinok prerušený na {{minutes}} min na pokyn {{authority}} s cieľom preparkovať vozidlo, {{location}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
