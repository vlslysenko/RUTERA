explanation.infringement.DAILY_DRIVING_EXCEEDED=El {{inf.date}} el tiempo de conducción diario fue de {{inf.recorded}}; el límite es {{inf.limit}} (exceso de {{inf.excess}}). Artículo 6, apartado 1, del Reglamento (CE) n.º 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=En la semana {{inf.period}} el tiempo de conducción diario se amplió a 10 horas más de dos veces ({{inf.recorded}}). Artículo 6, apartado 1, del Reglamento (CE) n.º 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=En la semana {{inf.period}} el tiempo de conducción semanal fue de {{inf.recorded}}; el límite es 56 h (exceso de {{inf.excess}}). Artículo 6, apartado 2, del Reglamento (CE) n.º 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=En las dos semanas consecutivas {{inf.period}} el tiempo total de conducción fue de {{inf.recorded}}; el límite es 90 h (exceso de {{inf.excess}}). Artículo 6, apartado 3, del Reglamento (CE) n.º 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=El {{inf.date}} ({{inf.period}}) se condujo durante {{inf.recorded}} sin la pausa obligatoria de al menos 45 minutos; el límite es 4 h 30 min (exceso de {{inf.excess}}). Artículo 7 del Reglamento (CE) n.º 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=El {{inf.date}} el descanso diario fue de {{inf.recorded}}; el mínimo obligatorio es {{inf.limit}} (reducción de {{inf.excess}}). Artículo 8 del Reglamento (CE) n.º 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=El descanso semanal en el periodo {{inf.period}} fue de {{inf.recorded}}; el mínimo obligatorio es {{inf.limit}} (reducción de {{inf.excess}}). Artículo 8, apartado 6, del Reglamento (CE) n.º 561/2006.
explanation.infringement.WEEKLY_REST_LATE=El descanso semanal no comenzó a más tardar al final de seis periodos de 24 horas desde el final del descanso semanal anterior (periodo {{inf.period}}, retraso de {{inf.excess}}). Artículo 8, apartado 6, del Reglamento (CE) n.º 561/2006.
explanation.infringement.REST_INTERRUPTED=El {{inf.date}} la pausa o el periodo de descanso se interrumpió ({{inf.period}}, {{inf.recorded}}). Artículos 7 a 9 del Reglamento (CE) n.º 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=El {{inf.date}} el tiempo de trabajo fue de {{inf.recorded}} y la pausa en el trabajo fue inferior a la obligatoria ({{inf.limit}}; faltan {{inf.excess}}). Artículo 5 de la Directiva 2002/15/CE, Real Decreto 1561/1995.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=El {{inf.date}}, con trabajo nocturno, el tiempo de trabajo fue de {{inf.recorded}}; el límite es 10 h (exceso de {{inf.excess}}). Artículo 7 de la Directiva 2002/15/CE, Real Decreto 1561/1995.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=En la semana {{inf.period}} el tiempo de trabajo fue de {{inf.recorded}}; el límite es {{inf.limit}} (exceso de {{inf.excess}}). Artículo 4 de la Directiva 2002/15/CE, Real Decreto 1561/1995.
explanation.infringement.MISSING_MANUAL_ENTRY=No hay registro de actividades para el periodo {{inf.period}} ({{inf.recorded}}); no se realizó la entrada manual. Artículo 34, apartado 3, del Reglamento (UE) n.º 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=El {{inf.date}} no se introdujo el símbolo del país (inicio o final del periodo de trabajo diario o paso de frontera): {{inf.recorded}}. Artículo 34, apartado 7, del Reglamento (UE) n.º 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=El {{inf.date}} ({{inf.period}}) se condujo el vehículo {{vehicle.plate}} sin tarjeta de conductor insertada ({{inf.recorded}}). Artículo 34, apartado 1, del Reglamento (UE) n.º 165/2014.
explanation.infringement.SPEEDING_EVENT=El {{inf.date}} el tacógrafo registró un exceso de velocidad ({{inf.recorded}}, periodo {{inf.period}}).
explanation.infringement.OTHER=El {{inf.date}} se detectó la siguiente irregularidad: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=atasco imprevisto tras un accidente
explanation.reason.TRAFFIC_ACCIDENT.text=La causa fue un atasco imprevisto provocado por un accidente de tráfico, que no podía preverse al planificar el viaje.
explanation.reason.ROAD_CLOSURE_DETOUR.short=corte repentino de carretera / desvío
explanation.reason.ROAD_CLOSURE_DETOUR.text=La causa fue un corte repentino de la carretera con un desvío obligatorio, desconocidos antes del inicio del viaje.
explanation.reason.EXTREME_WEATHER.short=fenómeno meteorológico extremo repentino
explanation.reason.EXTREME_WEATHER.text=La causa fue un empeoramiento repentino y grave de las condiciones meteorológicas y de la vía (p. ej., temporal de nieve, hielo, tormenta), que impidió detenerse con seguridad o continuar según lo previsto.
explanation.reason.NO_PARKING_SPACE.short=sin plazas libres en el aparcamiento
explanation.reason.NO_PARKING_SPACE.text=En el lugar de parada previsto y en los aparcamientos probados después no había ninguna plaza libre adecuada para el vehículo; solo se continuó hasta el lugar de parada adecuado más cercano.
explanation.reason.SECURITY_THREAT.short=peligro para el conductor, el vehículo o la carga
explanation.reason.SECURITY_THREAT.text=Detenerse en el lugar donde se alcanzó el límite habría puesto en peligro la seguridad del conductor, del vehículo o de la carga (p. ej., riesgo de robo o asalto, arcén peligroso).
explanation.reason.VEHICLE_BREAKDOWN.short=avería del vehículo
explanation.reason.VEHICLE_BREAKDOWN.text=Debido a una avería del vehículo fue necesario llegar a un lugar seguro o a un taller.
explanation.reason.LOAD_SAFETY.short=seguridad de la carga
explanation.reason.LOAD_SAFETY.text=Fue necesario asegurar la carga (p. ej., carga desplazada, avería del equipo de frío, mercancías peligrosas) y llegar a un lugar donde pudiera hacerse con seguridad.
explanation.reason.MEDICAL_EMERGENCY.short=urgencia médica / primeros auxilios
explanation.reason.MEDICAL_EMERGENCY.text=La causa fue una urgencia médica o la necesidad de prestar primeros auxilios a otra persona.
explanation.reason.AUTHORITY_ORDER.short=orden de la policía / autoridad / personal de la terminal
explanation.reason.AUTHORITY_ORDER.text=La pausa o el descanso se interrumpió por orden de la policía, de otra autoridad o del personal autorizado de la terminal para mover el vehículo (Nota orientativa n.º 3 de la Comisión).
explanation.reason.FERRY_TRAIN_DELAY.short=retraso del transbordador o del tren
explanation.reason.FERRY_TRAIN_DELAY.text=La causa fue un retraso o un cambio en la hora de salida o llegada del transbordador o del tren utilizado.
explanation.reason.REACH_HOME_OR_BASE.short=llegar al centro operativo o al domicilio para el descanso semanal
explanation.reason.REACH_HOME_OR_BASE.text=En circunstancias excepcionales se superó el tiempo de conducción para llegar al centro operativo del empresario o al lugar de residencia del conductor y tomar allí un descanso semanal.
explanation.reason.LOADING_DELAY.short=carga / descarga prolongada
explanation.reason.LOADING_DELAY.text=La causa fue una carga, descarga o espera prolongada en las instalaciones del cliente.
explanation.reason.DISPATCH_INSTRUCTION.short=instrucción del tráfico o del cliente
explanation.reason.DISPATCH_INSTRUCTION.text=Se continuó conduciendo por instrucción del responsable de tráfico o del cliente.
explanation.reason.OWN_PLANNING_ERROR.short=error propio al calcular el tiempo o la ruta
explanation.reason.OWN_PLANNING_ERROR.text=La causa fue un error propio al calcular el tiempo de conducción restante o la ruta.
explanation.reason.RECORDING_ERROR.short=error de manejo del tacógrafo
explanation.reason.RECORDING_ERROR.text=La causa fue un error de manejo del tacógrafo (p. ej., actividad incorrecta seleccionada, entrada manual o símbolo de país olvidados); las actividades realmente realizadas se describen a continuación.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=avería de la tarjeta o del tacógrafo
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=La causa fue una avería de la tarjeta de conductor o del tacógrafo; las actividades se registraron en impresiones conforme a los artículos 35 y 37 del Reglamento (UE) n.º 165/2014.
explanation.reason.DATA_DISPUTE.short=impugno la constatación
explanation.reason.DATA_DISPUTE.text=No estoy de acuerdo en que se haya producido un incumplimiento, por los motivos indicados a continuación.
explanation.reason.OTHER.short=otro motivo
explanation.reason.OTHER.text=El motivo se describe a continuación.
explanation.art12.claimSafety=Invoco el artículo 12, párrafo primero, del Reglamento (CE) n.º 561/2006. La excepción fue necesaria para garantizar la seguridad de las personas, del vehículo o de la carga y para llegar a un lugar de parada adecuado ({{art12.stopPlace}}); no se puso en peligro la seguridad vial.
explanation.art12.claimHome1h=Invoco el artículo 12, párrafo segundo, del Reglamento (CE) n.º 561/2006: en circunstancias excepcionales se superó el tiempo de conducción diario o semanal en {{inf.excess}} (como máximo 1 hora) para llegar a {{art12.destination}} y tomar un descanso semanal.
explanation.art12.claimHome2h=Invoco el artículo 12, párrafo tercero, del Reglamento (CE) n.º 561/2006: en circunstancias excepcionales se superó el tiempo de conducción diario o semanal en {{inf.excess}} (como máximo 2 horas) para llegar a {{art12.destination}} y tomar un descanso semanal normal; inmediatamente antes de la conducción adicional se tomó una pausa ininterrumpida de 30 minutos ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Soy consciente de que la ampliación debe compensarse con un periodo de descanso equivalente, tomado de una sola vez junto con cualquier periodo de descanso, antes del final de la tercera semana siguiente a la semana de que se trate.
explanation.art12.noteMade=El tipo y la causa de la excepción se indicaron a mano en la impresión del tacógrafo (o en la hoja de registro) el {{art12.noteDate}} a las {{art12.noteTime}}, a más tardar al llegar al lugar de parada. Se adjunta copia o fotografía.
explanation.art12.noteNotMade=En el momento del suceso no se hizo una anotación manuscrita de la excepción en la impresión del tacógrafo.
explanation.art12.notClaimed=No invoco el artículo 12 del Reglamento (CE) n.º 561/2006.
explanation.declaration.truth=Declaro que esta declaración es veraz y la presento voluntariamente. He podido ver los datos del tacógrafo en los que se basa la constatación.
explanation.declaration.dispute=No estoy de acuerdo con la constatación por el siguiente motivo: {{dispute.text}}
explanation.employer.received=Declaración recibida el {{employer.date}} por {{employer.signatory}}.
explanation.employer.assessJustified=Valoración: la excepción está justificada (circunstancias excepcionales e imprevisibles).
explanation.employer.assessNotJustified=Valoración: la declaración no justifica el incumplimiento.
explanation.employer.assessPending=Valoración: se requiere más aclaración.
explanation.employer.instructed=Se ha instruido al conductor sobre las normas de tiempos de conducción, pausas y periodos de descanso (artículos 6 a 9 del Reglamento (CE) n.º 561/2006) y sobre la obligación de indicar a mano el tipo y la causa de cualquier excepción en la impresión del tacógrafo a más tardar al llegar a un lugar de parada adecuado.
explanation.employer.actions=Medidas adoptadas: {{employer.actions}}
explanation.employer.refusal=El conductor se negó el {{refusal.date}} a presentar la declaración / a firmar. Testigo: {{refusal.witness}}.
