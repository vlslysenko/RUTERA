explanation.printout.art12Home={{date}} {{time}} Art. 12, párr. 2/3 Rgto. (CE) 561/2006: tiempo de conducción superado en {{excess}} para llegar a {{destination}} para el descanso semanal. Pausa 30 min {{breakFrom}}-{{breakTo}}. Motivo: {{reasonShort}}. {{driverName}}, tarjeta {{cardNumber}}, {{plate}}.
