explanation.infringement.DAILY_DRIVING_EXCEEDED=W dniu {{inf.date}} dzienny czas prowadzenia pojazdu wyniósł {{inf.recorded}} przy normie {{inf.limit}} (przekroczenie o {{inf.excess}}) – art. 6 ust. 1 rozporządzenia (WE) nr 561/2006.
explanation.infringement.DAILY_DRIVING_EXTENSION_OVERUSED=W tygodniu {{inf.period}} dzienny czas prowadzenia pojazdu wydłużono do 10 godzin więcej niż dwa razy ({{inf.recorded}}) – art. 6 ust. 1 rozporządzenia (WE) nr 561/2006.
explanation.infringement.WEEKLY_DRIVING_EXCEEDED=W tygodniu {{inf.period}} tygodniowy czas prowadzenia pojazdu wyniósł {{inf.recorded}} przy normie 56 godz. (przekroczenie o {{inf.excess}}) – art. 6 ust. 2 rozporządzenia (WE) nr 561/2006.
explanation.infringement.FORTNIGHTLY_DRIVING_EXCEEDED=W dwóch kolejnych tygodniach {{inf.period}} łączny czas prowadzenia pojazdu wyniósł {{inf.recorded}} przy normie 90 godz. (przekroczenie o {{inf.excess}}) – art. 6 ust. 3 rozporządzenia (WE) nr 561/2006.
explanation.infringement.CONTINUOUS_DRIVING_EXCEEDED=W dniu {{inf.date}} ({{inf.period}}) pojazd był prowadzony przez {{inf.recorded}} bez wymaganej przerwy trwającej co najmniej 45 minut, przy normie 4 godz. 30 min (przekroczenie o {{inf.excess}}) – art. 7 rozporządzenia (WE) nr 561/2006.
explanation.infringement.DAILY_REST_INSUFFICIENT=W dniu {{inf.date}} dzienny okres odpoczynku wyniósł {{inf.recorded}} przy wymaganym minimum {{inf.limit}} (skrócenie o {{inf.excess}}) – art. 8 rozporządzenia (WE) nr 561/2006.
explanation.infringement.WEEKLY_REST_INSUFFICIENT=Tygodniowy okres odpoczynku w okresie {{inf.period}} wyniósł {{inf.recorded}} przy wymaganym minimum {{inf.limit}} (skrócenie o {{inf.excess}}) – art. 8 ust. 6 rozporządzenia (WE) nr 561/2006.
explanation.infringement.WEEKLY_REST_LATE=Tygodniowy okres odpoczynku nie rozpoczął się po upływie sześciu okresów 24-godzinnych od końca poprzedniego tygodniowego okresu odpoczynku (okres {{inf.period}}, opóźnienie {{inf.excess}}) – art. 8 ust. 6 rozporządzenia (WE) nr 561/2006.
explanation.infringement.REST_INTERRUPTED=W dniu {{inf.date}} przerwa lub okres odpoczynku zostały przerwane ({{inf.period}}, {{inf.recorded}}) – art. 7–9 rozporządzenia (WE) nr 561/2006.
explanation.infringement.WORK_BREAK_INSUFFICIENT=W dniu {{inf.date}} czas pracy wyniósł {{inf.recorded}}, a przerwa w pracy była krótsza niż wymagana ({{inf.limit}}; niedobór {{inf.excess}}) – art. 13 ustawy o czasie pracy kierowców.
explanation.infringement.NIGHT_WORK_TIME_EXCEEDED=W dniu {{inf.date}}, przy wykonywaniu pracy w porze nocnej, czas pracy wyniósł {{inf.recorded}} przy normie 10 godz. (przekroczenie o {{inf.excess}}) – art. 21 ustawy o czasie pracy kierowców.
explanation.infringement.WEEKLY_WORKING_TIME_EXCEEDED=W tygodniu {{inf.period}} czas pracy wyniósł {{inf.recorded}} przy normie {{inf.limit}} (przekroczenie o {{inf.excess}}) – art. 12 ustawy o czasie pracy kierowców.
explanation.infringement.MISSING_MANUAL_ENTRY=Brak zapisu aktywności za okres {{inf.period}} ({{inf.recorded}}); nie dokonano wpisu ręcznego – art. 34 ust. 3 rozporządzenia (UE) nr 165/2014.
explanation.infringement.MISSING_COUNTRY_SYMBOL=W dniu {{inf.date}} nie wprowadzono symbolu państwa (rozpoczęcie lub zakończenie dziennego okresu pracy albo przekroczenie granicy): {{inf.recorded}} – art. 34 ust. 7 rozporządzenia (UE) nr 165/2014.
explanation.infringement.DRIVING_WITHOUT_CARD=W dniu {{inf.date}} ({{inf.period}}) pojazd {{vehicle.plate}} był prowadzony bez włożonej karty kierowcy ({{inf.recorded}}) – art. 34 ust. 1 rozporządzenia (UE) nr 165/2014.
explanation.infringement.SPEEDING_EVENT=W dniu {{inf.date}} tachograf zarejestrował zdarzenie przekroczenia prędkości ({{inf.recorded}}, okres {{inf.period}}).
explanation.infringement.OTHER=W dniu {{inf.date}} stwierdzono następującą nieprawidłowość: {{inf.recorded}}.
explanation.reason.TRAFFIC_ACCIDENT.short=nieprzewidziany korek po wypadku
explanation.reason.TRAFFIC_ACCIDENT.text=Przyczyną był nieprzewidziany zator drogowy spowodowany wypadkiem, którego nie można było przewidzieć przy planowaniu trasy.
explanation.reason.ROAD_CLOSURE_DETOUR.short=nagłe zamknięcie drogi / objazd
explanation.reason.ROAD_CLOSURE_DETOUR.text=Przyczyną było nagłe zamknięcie drogi i wyznaczony objazd, o których nie było wiadomo przed rozpoczęciem jazdy.
explanation.reason.EXTREME_WEATHER.short=gwałtowne załamanie pogody
explanation.reason.EXTREME_WEATHER.text=Przyczyną było gwałtowne pogorszenie warunków pogodowych i drogowych (np. śnieżyca, gołoledź, wichura), które uniemożliwiało bezpieczny postój lub dalszą jazdę zgodnie z planem.
explanation.reason.NO_PARKING_SPACE.short=brak wolnych miejsc na parkingu
explanation.reason.NO_PARKING_SPACE.text=Na planowanym miejscu postoju ani na kolejnych sprawdzonych parkingach nie było wolnego miejsca odpowiedniego dla pojazdu; jazdę kontynuowano wyłącznie do najbliższego odpowiedniego miejsca postoju.
explanation.reason.SECURITY_THREAT.short=zagrożenie bezpieczeństwa kierowcy, pojazdu lub ładunku
explanation.reason.SECURITY_THREAT.text=Postój w miejscu, w którym upłynęła norma, zagrażałby bezpieczeństwu kierowcy, pojazdu lub ładunku (np. ryzyko kradzieży lub napadu, niebezpieczne pobocze).
explanation.reason.VEHICLE_BREAKDOWN.short=awaria pojazdu
explanation.reason.VEHICLE_BREAKDOWN.text=Z powodu awarii pojazdu konieczne było dotarcie do bezpiecznego miejsca lub punktu naprawy.
explanation.reason.LOAD_SAFETY.short=zabezpieczenie ładunku
explanation.reason.LOAD_SAFETY.text=Konieczne było zabezpieczenie ładunku (np. przesunięty ładunek, awaria agregatu chłodniczego, towary niebezpieczne) i dotarcie do miejsca, w którym można to było zrobić bezpiecznie.
explanation.reason.MEDICAL_EMERGENCY.short=nagły stan zdrowia / udzielanie pomocy
explanation.reason.MEDICAL_EMERGENCY.text=Przyczyną była nagła sytuacja zdrowotna lub konieczność udzielenia pierwszej pomocy innej osobie.
explanation.reason.AUTHORITY_ORDER.short=polecenie policji / służb / obsługi terminalu
explanation.reason.AUTHORITY_ORDER.text=Przerwa lub odpoczynek zostały przerwane na polecenie policji, innych służb lub upoważnionej obsługi terminalu w celu przestawienia pojazdu (wytyczne Komisji nr 3).
explanation.reason.FERRY_TRAIN_DELAY.short=opóźnienie promu lub pociągu
explanation.reason.FERRY_TRAIN_DELAY.text=Przyczyną było opóźnienie lub zmiana godziny odpłynięcia, odjazdu albo przybycia promu lub pociągu, z którego korzystano podczas przewozu.
explanation.reason.REACH_HOME_OR_BASE.short=dojazd do bazy lub miejsca zamieszkania na odpoczynek tygodniowy
explanation.reason.REACH_HOME_OR_BASE.text=W wyjątkowych okolicznościach czas prowadzenia pojazdu został wydłużony w celu dotarcia do centrum operacyjnego pracodawcy lub miejsca zamieszkania kierowcy, aby wykorzystać tygodniowy okres odpoczynku.
explanation.reason.LOADING_DELAY.short=przedłużający się załadunek / rozładunek
explanation.reason.LOADING_DELAY.text=Przyczyną był przedłużający się załadunek, rozładunek lub oczekiwanie u klienta.
explanation.reason.DISPATCH_INSTRUCTION.short=polecenie dyspozytora lub klienta
explanation.reason.DISPATCH_INSTRUCTION.text=Jazdę kontynuowano na polecenie dyspozytora lub klienta.
explanation.reason.OWN_PLANNING_ERROR.short=własny błąd w ocenie czasu lub trasy
explanation.reason.OWN_PLANNING_ERROR.text=Przyczyną był własny błąd kierowcy w ocenie pozostałego czasu jazdy lub trasy.
explanation.reason.RECORDING_ERROR.short=błąd obsługi tachografu
explanation.reason.RECORDING_ERROR.text=Przyczyną był błąd obsługi tachografu (np. wybrano niewłaściwą aktywność, pominięto wpis ręczny lub symbol państwa); faktycznie wykonywane czynności opisano poniżej.
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.short=awaria karty kierowcy lub tachografu
explanation.reason.CARD_OR_TACHOGRAPH_FAULT.text=Przyczyną była awaria karty kierowcy lub tachografu; aktywności zarejestrowano na wydrukach zgodnie z art. 35 i 37 rozporządzenia (UE) nr 165/2014.
explanation.reason.DATA_DISPUTE.short=kwestionuję ustalenie
explanation.reason.DATA_DISPUTE.text=Nie zgadzam się, że doszło do naruszenia, z powodów opisanych poniżej.
explanation.reason.OTHER.short=inna przyczyna
explanation.reason.OTHER.text=Przyczynę opisano poniżej.
explanation.art12.claimSafety=Powołuję się na art. 12 akapit pierwszy rozporządzenia (WE) nr 561/2006. Odstępstwo było niezbędne dla zapewnienia bezpieczeństwa osób, pojazdu lub ładunku oraz dotarcia do odpowiedniego miejsca postoju ({{art12.stopPlace}}) i nie zagrażało bezpieczeństwu ruchu drogowego.
explanation.art12.claimHome1h=Powołuję się na art. 12 akapit drugi rozporządzenia (WE) nr 561/2006: w wyjątkowych okolicznościach dzienny lub tygodniowy czas prowadzenia pojazdu został przekroczony o {{inf.excess}} (maksymalnie 1 godz.) w celu dotarcia do {{art12.destination}} i wykorzystania tygodniowego okresu odpoczynku.
explanation.art12.claimHome2h=Powołuję się na art. 12 akapit trzeci rozporządzenia (WE) nr 561/2006: w wyjątkowych okolicznościach dzienny lub tygodniowy czas prowadzenia pojazdu został przekroczony o {{inf.excess}} (maksymalnie 2 godz.) w celu dotarcia do {{art12.destination}} i wykorzystania regularnego tygodniowego okresu odpoczynku; bezpośrednio przed dodatkowym czasem jazdy wykorzystano nieprzerwaną 30-minutową przerwę ({{art12.breakFrom}}–{{art12.breakTo}}).
explanation.art12.compensation=Przyjmuję do wiadomości, że okres wydłużenia musi zostać zrekompensowany równoważnym okresem odpoczynku, wykorzystanym łącznie z dowolnym okresem odpoczynku, do końca trzeciego tygodnia następującego po danym tygodniu.
explanation.art12.noteMade=Rodzaj i powód odstępstwa wpisano ręcznie na wydruku z tachografu (lub wykresówce) w dniu {{art12.noteDate}} o godz. {{art12.noteTime}}, najpóźniej po przybyciu do miejsca postoju. Kopia lub zdjęcie wydruku w załączeniu.
explanation.art12.noteNotMade=W chwili zdarzenia nie sporządzono ręcznej adnotacji o odstępstwie na wydruku z tachografu.
explanation.art12.notClaimed=Nie powołuję się na art. 12 rozporządzenia (WE) nr 561/2006.
explanation.declaration.truth=Oświadczam, że powyższe wyjaśnienie jest zgodne z prawdą i składam je dobrowolnie. Zapoznałem(-am) się z danymi z tachografu, na podstawie których stwierdzono naruszenie.
explanation.declaration.dispute=Nie zgadzam się z ustaleniem z następującego powodu: {{dispute.text}}
explanation.employer.received=Wyjaśnienie przyjął(-ęła) dnia {{employer.date}}: {{employer.signatory}}.
explanation.employer.assessJustified=Ocena: odstępstwo uzasadnione (wyjątkowe, nieprzewidywalne okoliczności).
explanation.employer.assessNotJustified=Ocena: wyjaśnienie nie usprawiedliwia naruszenia.
explanation.employer.assessPending=Ocena: sprawa wymaga dalszego wyjaśnienia.
explanation.employer.instructed=Kierowcę pouczono o normach czasu prowadzenia pojazdu, przerw i odpoczynków (art. 6–9 rozporządzenia (WE) nr 561/2006) oraz o obowiązku ręcznego wpisania rodzaju i powodu odstępstwa na wydruku z tachografu najpóźniej po przybyciu do odpowiedniego miejsca postoju.
explanation.employer.actions=Podjęte działania: {{employer.actions}}
explanation.employer.refusal=Kierowca odmówił złożenia wyjaśnienia / podpisu w dniu {{refusal.date}}. Świadek: {{refusal.witness}}.
explanation.signature.driver=Podpis kierowcy
explanation.signature.employer=Podpis pracodawcy lub osoby upoważnionej
explanation.signature.electronic=Podpisano na ekranie w aplikacji RUTERA dnia {{sign.timestamp}}.
explanation.printout.instruction=Wpisz ten tekst ręcznie na odwrocie wydruku z tachografu (lub na wykresówce) najpóźniej po dotarciu do miejsca postoju i podpisz. Wydruk przechowuj w pojeździe.
explanation.printout.art12Safety={{date}} {{time}} Art. 12 rozp. (WE) 561/2006: {{reasonShort}}, {{location}}. {{infringementShort}} {{excess}} w celu dotarcia do bezpiecznego miejsca postoju: {{stopPlace}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.art12Home={{date}} {{time}} Art. 12 akapit 2/3 rozp. (WE) 561/2006: przekroczenie czasu jazdy o {{excess}} w celu dotarcia do {{destination}} na odpoczynek tygodniowy. Przerwa 30 min {{breakFrom}}-{{breakTo}}. Przyczyna: {{reasonShort}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.restInterrupted={{date}} {{time}} Odpoczynek przerwany na {{minutes}} min na polecenie {{authority}} w celu przestawienia pojazdu, {{location}}. {{driverName}}, karta {{cardNumber}}, {{plate}}.
explanation.printout.cardFault={{date}} Karta kierowcy nr {{cardNumber}} uszkodzona / nie działa / utracona. {{driverName}}, prawo jazdy nr {{licenceNumber}}, {{plate}}. Aktywności: {{activities}}.
