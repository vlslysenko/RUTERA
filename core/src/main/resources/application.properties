# RUTERA core: built-in defaults. An installation overrides them in conf/application.properties
# (picked up automatically) or with environment variables; every value here has a default.
spring.application.name=rutera
rutera.mode=standalone

# --- HTTP / session (Jetty) ---
server.port=${RUTERA_PORT:8080}
server.servlet.session.cookie.name=RUTERA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RUTERA_COOKIE_SECURE:false}
# Idle timeout of a session; the absolute age since the sign-in is rutera.security.session-max-age.
server.servlet.session.timeout=${RUTERA_SESSION_TIMEOUT:4h}
# Behind a reverse proxy: native = take the client address, scheme and host from X-Forwarded-* (only when RUTERA is
# not reachable directly, else clients could fake their address).
server.forward-headers-strategy=${RUTERA_FORWARD_HEADERS:none}
# The React client in the jar (classpath:/static/) is served by core.config.FrontendConfig, with SPA fallback.
spring.web.resources.add-mappings=false

# --- Database (MySQL 8.4; compose.yaml publishes it on 3307 by default) ---
spring.datasource.url=jdbc:mysql://${RUTERA_DB_HOST:localhost}:${RUTERA_DB_PORT:3307}/${RUTERA_DB_NAME:rutera}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${RUTERA_DB_USER:rutera}
spring.datasource.password=${RUTERA_DB_PASSWORD:rutera}
spring.datasource.hikari.maximum-pool-size=10

# Schema comes from Flyway migrations (rutera-common, db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- Security (core.security.RuteraSecurityProperties) ---
# Session cookie only (no ;jsessionid in URLs); CSRF cookie XSRF-TOKEN / header X-XSRF-TOKEN, see SecurityConfig.
server.servlet.session.tracking-modes=cookie
rutera.security.lockout-max-attempts=${RUTERA_LOCKOUT_ATTEMPTS:5}
rutera.security.lockout-duration=${RUTERA_LOCKOUT_DURATION:15m}
rutera.security.bcrypt-strength=12
rutera.security.password-min-length=${RUTERA_PASSWORD_MIN_LENGTH:10}
# Failed sign-ins from one client address in a window, then 429 auth.login.throttled until the window ends.
rutera.security.ip-max-failures=${RUTERA_LOGIN_IP_MAX_FAILURES:20}
rutera.security.ip-window=${RUTERA_LOGIN_IP_WINDOW:15m}
# Absolute lifetime of a session since the sign-in.
rutera.security.session-max-age=${RUTERA_SESSION_MAX_AGE:12h}
# Content-Security-Policy of the web application; empty = the built-in one (RuteraSecurityProperties.DEFAULT_CSP).
rutera.security.content-security-policy=${RUTERA_CSP:}
# Sign-in is our own (core.auth.AuthService): no Boot in-memory user with a "generated security password".
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- First start on an empty database (core.bootstrap.BootstrapRunner) ---
rutera.bootstrap.enabled=true
rutera.bootstrap.firma-name=${RUTERA_BOOTSTRAP_FIRMA_NAME:My company}
rutera.bootstrap.firma-country=${RUTERA_BOOTSTRAP_FIRMA_COUNTRY:PL}
rutera.bootstrap.language=${RUTERA_BOOTSTRAP_LANG:en}
rutera.bootstrap.admin-login=${RUTERA_BOOTSTRAP_ADMIN_LOGIN:admin}
# Empty: a random password is generated and written to the log once.
rutera.bootstrap.admin-password=${RUTERA_BOOTSTRAP_ADMIN_PASSWORD:}
rutera.bootstrap.admin-name=${RUTERA_BOOTSTRAP_ADMIN_NAME:Administrator}
# Cloud: the operator account (SUPERUSER without a firma, /app/operator/firmas), created at start when the login is set
# and does not exist yet; empty password = generated and written to the log once (core.bootstrap.OperatorBootstrap).
rutera.bootstrap.operator-login=${RUTERA_BOOTSTRAP_OPERATOR_LOGIN:}
rutera.bootstrap.operator-password=${RUTERA_BOOTSTRAP_OPERATOR_PASSWORD:}

# --- Paid options of a standalone installation (core.bootstrap.StandaloneLicence) ---
# Written to every firma at each start when set; empty = the database value stays (it can be changed with SQL).
rutera.standalone.ai-access=${RUTERA_AI_ACCESS:}
rutera.standalone.plan=${RUTERA_PLAN:}
rutera.standalone.vehicle-limit=${RUTERA_VEHICLE_LIMIT:}

# --- Uploaded files (core.storage.FileStorage): standalone keeps them on disk, relative to the working directory ---
rutera.storage.dir=${RUTERA_STORAGE_DIR:data/files}
# Tachograph import: up to 50 files of 20 MB each are checked per file; the container limits stop anything larger.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=200MB

# --- E-mail (payment reminders, core.mail.OutboxSender) ---
# SMTP stays off until spring.mail.host is set (env SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true); until then the e-mails wait in
# email_outbox as QUEUED. The sender address defaults to the SMTP user name.
rutera.mail.from=${RUTERA_MAIL_FROM:${spring.mail.username:}}
rutera.mail.from-name=${RUTERA_MAIL_FROM_NAME:RUTERA}
# Scheduled jobs: the outbox every minute, the reminder plans every hour
rutera.scheduling.enabled=true

# --- Public API (paid AI access module): bearer tokens, /api/v1, OpenAPI document ---
rutera.api.rate-per-minute=${RUTERA_API_RATE_PER_MINUTE:120}
# Public address (https://rutera.example.com): OAuth issuer and the URLs published to MCP clients such as claude.ai.
# Required behind a reverse proxy; empty = taken from the request.
rutera.public-url=${RUTERA_PUBLIC_URL:}
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=com.rutera.core

# --- Web Push (driver cabinet notifications, core.push.PushService): VAPID keys, empty = off ---
# Public key: uncompressed P-256 point, private key: its 32-byte scalar, both base64url (README, "Web Push").
rutera.push.vapid-public=${RUTERA_PUSH_VAPID_PUBLIC:}
rutera.push.vapid-private=${RUTERA_PUSH_VAPID_PRIVATE:}
# Contact of the operator for the push services (mailto: or https:), default rutera.public-url
rutera.push.subject=${RUTERA_PUSH_SUBJECT:}

# --- Routing (trip calculator, map): Valhalla base URL, empty = no routing; geocoding with Nominatim ---
rutera.routing.url=${RUTERA_ROUTING_URL:}
rutera.routing.timeout=30s
# The public Nominatim instance is for development only (usage policy: 1 request/s, identifying User-Agent)
rutera.geocoding.url=${RUTERA_GEOCODING_URL:https://nominatim.openstreetmap.org}
rutera.geocoding.user-agent=${RUTERA_GEOCODING_USER_AGENT:RUTERA/1.0 (+https://github.com/vlslysenko/RUTERA)}

# --- i18n ---
# Optional directory with override bundles (messages_xx.properties), e.g. ./conf/i18n
rutera.i18n.external-dir=
rutera.i18n.cache-seconds=60

# --- Actuator ---
# Only health is exposed (public); details only for signed-in users.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
