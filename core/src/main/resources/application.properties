# RUTERA core: built-in defaults. An installation overrides them in conf/application.properties
# (picked up automatically) or with environment variables; every value here has a default.
spring.application.name=rutera
rutera.mode=standalone

# --- HTTP / session (Jetty) ---
server.port=${RUTERA_PORT:8080}
server.servlet.session.cookie.name=RUTERA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RUTERA_COOKIE_SECURE:false}
server.servlet.session.timeout=4h

# --- Database (MySQL 8.4; compose.yaml publishes it on 3307 by default) ---
spring.datasource.url=jdbc:mysql://${RUTERA_DB_HOST:localhost}:${RUTERA_DB_PORT:3307}/${RUTERA_DB_NAME:rutera}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${RUTERA_DB_USER:rutera}
spring.datasource.password=${RUTERA_DB_PASSWORD:rutera}
spring.datasource.hikari.maximum-pool-size=10

# Schema comes from Flyway migrations (rutera-common, db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- Security (core.security.RuteraSecurityProperties) ---
# Session cookie only (no ;jsessionid in URLs); CSRF cookie XSRF-TOKEN / header X-XSRF-TOKEN, see SecurityConfig.
server.servlet.session.tracking-modes=cookie
rutera.security.lockout-max-attempts=${RUTERA_LOCKOUT_ATTEMPTS:5}
rutera.security.lockout-duration=${RUTERA_LOCKOUT_DURATION:15m}
rutera.security.bcrypt-strength=12
rutera.security.password-min-length=${RUTERA_PASSWORD_MIN_LENGTH:10}

# --- First start on an empty database (core.bootstrap.BootstrapRunner) ---
rutera.bootstrap.enabled=true
rutera.bootstrap.firma-name=${RUTERA_BOOTSTRAP_FIRMA_NAME:My company}
rutera.bootstrap.firma-country=${RUTERA_BOOTSTRAP_FIRMA_COUNTRY:PL}
rutera.bootstrap.language=${RUTERA_BOOTSTRAP_LANG:en}
rutera.bootstrap.admin-login=${RUTERA_BOOTSTRAP_ADMIN_LOGIN:admin}
# Empty: a random password is generated and written to the log once.
rutera.bootstrap.admin-password=${RUTERA_BOOTSTRAP_ADMIN_PASSWORD:}
rutera.bootstrap.admin-name=${RUTERA_BOOTSTRAP_ADMIN_NAME:Administrator}

# --- i18n ---
# Optional directory with override bundles (messages_xx.properties), e.g. ./conf/i18n
rutera.i18n.external-dir=
rutera.i18n.cache-seconds=60

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
