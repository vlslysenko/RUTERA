# RUTERA with Docker Compose: the standalone stack and the database for local development.
#   Standalone, one command:   docker compose up -d --build   -> http://localhost:8080 (RUTERA_PORT)
#   Development database only: docker compose up -d mysql     -> localhost:3307 (RUTERA_DB_PORT)
#   First start: the owner's generated password: docker compose exec rutera grep "generated password" logs/rutera.log
#   Stop: docker compose down        (add -v to drop the data volumes)
# Settings come from .env next to this file (copy .env.example); every value has a default.
name: rutera

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-file-per-table=1
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${RUTERA_DB_NAME:-rutera}
      MYSQL_USER: ${RUTERA_DB_USER:-rutera}
      MYSQL_PASSWORD: ${RUTERA_DB_PASSWORD:-rutera}
      MYSQL_ROOT_PASSWORD: ${RUTERA_DB_ROOT_PASSWORD:-root}
    # Published for development (the jar started from the IDE); the rutera service uses the compose network.
    ports:
      - "${RUTERA_DB_PORT:-3307}:3306"
    volumes:
      - rutera-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rutera:
    build: .
    image: rutera:${RUTERA_IMAGE_TAG:-latest}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RUTERA_DB_HOST: mysql
      RUTERA_DB_PORT: 3306
      RUTERA_DB_NAME: ${RUTERA_DB_NAME:-rutera}
      RUTERA_DB_USER: ${RUTERA_DB_USER:-rutera}
      RUTERA_DB_PASSWORD: ${RUTERA_DB_PASSWORD:-rutera}
      RUTERA_COOKIE_SECURE: ${RUTERA_COOKIE_SECURE:-false}
      RUTERA_BOOTSTRAP_FIRMA_NAME: ${RUTERA_BOOTSTRAP_FIRMA_NAME:-My company}
      RUTERA_BOOTSTRAP_FIRMA_COUNTRY: ${RUTERA_BOOTSTRAP_FIRMA_COUNTRY:-PL}
      RUTERA_BOOTSTRAP_LANG: ${RUTERA_BOOTSTRAP_LANG:-en}
      RUTERA_BOOTSTRAP_ADMIN_LOGIN: ${RUTERA_BOOTSTRAP_ADMIN_LOGIN:-admin}
      RUTERA_BOOTSTRAP_ADMIN_PASSWORD: ${RUTERA_BOOTSTRAP_ADMIN_PASSWORD:-}
      RUTERA_BOOTSTRAP_ADMIN_NAME: ${RUTERA_BOOTSTRAP_ADMIN_NAME:-Administrator}
      RUTERA_LOCKOUT_ATTEMPTS: ${RUTERA_LOCKOUT_ATTEMPTS:-5}
      RUTERA_LOCKOUT_DURATION: ${RUTERA_LOCKOUT_DURATION:-15m}
      JAVA_TOOL_OPTIONS: ${RUTERA_JAVA_OPTS:-}
    ports:
      - "${RUTERA_PORT:-8080}:8080"
    volumes:
      # conf/application.properties and conf/logback.xml, when present, override the built-in settings.
      - rutera-conf:/opt/rutera/conf
      - rutera-logs:/opt/rutera/logs
      # Uploaded files (tachograph downloads), see rutera.storage.dir
      - rutera-data:/opt/rutera/data
    healthcheck:
      # The JRE image has neither curl nor wget: bash sends the request through /dev/tcp.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"status\":\"UP\"" <&3']
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

volumes:
  rutera-mysql-data:
  rutera-conf:
  rutera-logs:
  rutera-data:
